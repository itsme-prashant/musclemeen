    const f = (k, label, ph, unit) => `<label class="field"><span>${label}${unit ? ` (${unit})` : ''}</span><input class="input" name="${k}" type="number" inputmode="decimal" step="any" placeholder="${ph}" value="${d[k] ?? ''}"></label>`;
    body = `<form id="obStats" class="card stack" novalidate>
      <div class="form-grid">${f('age', 'Age', '28', 'years')}${f('height', 'Height', '170', 'cm')}${f('weight', 'Weight', '72', 'kg')}${f('targetWeight', 'Target weight', '65', 'kg')}</div>
      <button class="btn btn-primary btn-lg btn-block" type="submit">Continue</button>
      <button class="btn btn-block" type="button" data-action="ob-skip">Skip for now</button>
    </form>`;
  } else {
    const thisMon = mondayOf(new Date()), nextMon = addDays(thisMon, 7);
    const dow = (new Date().getDay() + 6) % 7;
    const defNext = dow >= 3;  // Thursday or later → start next Monday
    body = `${disclaimerBlock()}
      <div class="card stack">
        <dl class="summary-list">
          <dt>Goal</dt><dd>${GOALS[d.goal]}</dd>
          <dt>Experience</dt><dd>${LEVELS[d.level]}</dd>
          <dt>Split</dt><dd>${d.days} days · ${SPLIT_NAMES[d.days]}</dd>
          <dt>Session</dt><dd>${d.session} min</dd>
          <dt>Equipment</dt><dd>${EQUIPMENT_PROFILES[d.equipment].label}</dd>
          <dt>Emphasis</dt><dd>${EMPHASIS[resolveEmphasis(d)]}</dd>
        </dl>
      </div>
      <div class="stack-s"><strong>When do you want to start?</strong>
        <div class="radio-cards">
          <label class="radio-card"><input type="radio" name="obStart" value="${iso(thisMon)}" ${defNext ? '' : 'checked'}><strong>This week</strong><br><span class="muted small">Week 1 began Mon ${fmtShort(iso(thisMon))}</span></label>
          <label class="radio-card"><input type="radio" name="obStart" value="${iso(nextMon)}" ${defNext ? 'checked' : ''}><strong>Next Monday</strong><br><span class="muted small">${fmtDate(nextMon)}</span></label>
        </div>
      </div>
      <label class="check-item"><input type="checkbox" id="obAgree"><span class="box">${icon('check', 22)}</span><span>I understand this is general guidance, not medical advice. I’ll consult a doctor if I have injuries, am pregnant or have a medical condition, and I’ll stop any exercise that causes pain.</span></label>
      <button class="btn btn-primary btn-lg btn-block" type="button" data-action="ob-finish">Generate my 12-week program</button>`;
  }
  app.innerHTML = `<div class="ob">
    <div class="ob-top">
      ${OB.step > 0 ? `<button class="icon-btn" type="button" data-action="ob-back" aria-label="Back">${icon('left')}</button>` : `<a class="icon-btn" href="#/home" aria-label="Exit">${icon('left')}</a>`}
      <div class="progress" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
      <span class="small muted">${OB.step + 1}/${OB_STEPS.length}</span>
    </div>
    <div class="stack-s"><div class="eyebrow">Step ${OB.step + 1}</div><h1>${step.title}</h1><p class="muted">${step.sub}</p></div>
    ${body}
  </div>`;
}

function finishOnboarding() {
  if (!$('#obAgree').checked) { toast('Please tick the safety acknowledgement first.'); $('#obAgree').focus(); return; }
  const start = ($('input[name="obStart"]:checked') || {}).value || iso(mondayOf(new Date()));
  const prev = S.profile;
  S.profile = Object.assign({}, DEFAULT_PROFILE, OB.draft, {
    startDate: start, createdAt: prev && prev.createdAt ? prev.createdAt : new Date().toISOString(), swaps: (prev && prev.swaps) || {},
  });
  persist('profile');
  // seed the body-weight chart with the starting weight
  if (S.profile.weight && !S.measures.some(m => m.weight)) {
    S.measures.push({ date: todayISO(), weight: S.profile.weight });
    persist('measures');
  }
  planCache.clear();
  OB.draft = null; OB.step = 0; OB.touched = null;
  toast('Your 12-week program is ready 💪');
  location.hash = '#/today';
}

/* ---------- TODAY ---------- */
function viewToday(arg) {
  viewDate = /^\d{4}-\d{2}-\d{2}$/.test(arg || '') ? arg : todayISO();
  const d = parseISO(viewDate), isToday = viewDate === todayISO();
  const plan = dayPlan(viewDate);
  const datebar = `<div class="datebar">
    <a class="icon-btn" href="#/today/${iso(addDays(d, -1))}" aria-label="Previous day">${icon('left')}</a>
    <div class="datebar-mid"><span class="eyebrow">${isToday ? t('today.today') : (viewDate < todayISO() ? 'Past day' : 'Upcoming')}</span><strong>${fmtDate(d, { weekday: 'long', day: 'numeric', month: 'short' })}</strong>${isToday ? '' : `<a href="#/today">Jump to today</a>`}</div>
    <a class="icon-btn" href="#/today/${iso(addDays(d, 1))}" aria-label="Next day">${icon('right')}</a>
  </div>`;
  let body, banners = '';
  if (isToday && plan.status !== 'before' && plan.status !== 'after') {
    const miss = missedWorkout();
    if (miss && miss.status === 'train') banners += `<div class="alert info">${icon('calendar')}<div><strong>You missed ${esc(miss.title)} on ${fmtDate(parseISO(miss.date))}.</strong> Do it today instead? The rest of your plan moves back ${daysBetween(miss.date, todayISO())} day(s).<div class="row" style="margin-top:8px"><button class="btn btn-sm btn-primary" type="button" data-action="shift-missed" data-date="${miss.date}">Do it today</button></div></div></div>`;
    const fat = fatigueCheck(), wk = currentWeek();
    if (fat.high && !isDeload(wk) && !(S.profile.dismissedFatigue || []).includes(wk)) banners += `<div class="alert danger">${icon('alert')}<div><strong>Recovery looks low.</strong> ${fat.avg >= 9 ? `Your sets averaged RPE ${fat.avg.toFixed(1)} over 2 weeks. ` : ''}${fat.stalled.length ? `Stalled: ${esc(fat.stalled.slice(0, 3).join(', '))}. ` : ''}A lighter week now usually means faster progress after.<div class="row" style="margin-top:8px"><button class="btn btn-sm btn-primary" type="button" data-action="extra-deload">Make week ${wk} a deload</button><button class="btn btn-sm" type="button" data-action="dismiss-fatigue">Not now</button></div></div></div>`;
    if ((S.profile.injuries || []).length) banners += `<div class="alert info small">${icon('shield')}<div><strong>Injury-friendly mode:</strong> ${S.profile.injuries.map(a => INJURY_AREAS[a]).join(', ')}. Exercises that load these areas heavily are swapped out. Stay in a pain-free range.</div></div>`;
  }
  if (plan.status === 'moved') body = `<section class="card stack"><div class="eyebrow">Rescheduled</div><h2>This workout moved to ${fmtDate(parseISO(plan.to))}</h2><p class="muted">Life happens – your plan was pushed back so you don't skip a session.</p><a class="btn btn-primary btn-block" href="#/today/${plan.to}">Open it</a></section>`;
  else if (plan.status === 'train') body = workoutView(plan);
  else if (plan.status === 'rest') body = restDayView(plan);
  else if (plan.status === 'before') body = `<section class="card stack"><div class="eyebrow">Not started yet</div><h2>Program starts ${fmtDate(parseISO(S.profile.startDate), { weekday: 'long', day: 'numeric', month: 'long' })}</h2><p class="muted">Get familiar with the exercises in the library, and keep moving with the recovery routine below.</p><a class="btn btn-primary btn-block" href="#/today/${S.profile.startDate}">Preview day 1</a></section>${restDayView({ week: 0 })}`;
  else body = `<section class="card stack"><div class="eyebrow">Week 12 complete</div><h2>You finished the program! 🏆</h2><p class="muted">Check your progress, then start a fresh 12-week cycle – your new numbers become the starting point.</p><div class="row"><a class="btn btn-primary" href="#/progress">See my progress</a><button class="btn" type="button" data-action="restart">Start new cycle</button></div></section>`;
  app.innerHTML = `<div class="page">${datebar}${banners}${body}</div>`;
}

function workoutView(plan) {
  const log = S.logs[viewDate] || {};
  const total = plan.exercises.reduce((n, it) => n + it.rx.sets, 0);
  const done = plan.exercises.reduce((n, it) => n + ((log.sets || {})[it.ex.id] || []).filter(s => s && s.done).length, 0);
  const est = Math.round(plan.exercises.reduce((m, it) => m + it.rx.sets * (it.rx.rest + 40), 0) / 60) + 8 + 5;
  const ph = phaseInfo(plan.week);
  return `
    <section class="wk-head">
      <div class="eyebrow">Week ${plan.week} · Day ${plan.dayNum}</div>
      <h1>${esc(plan.title)}</h1>
      <div class="wk-meta">
        ${plan.deload ? '<span class="badge warn">Deload week</span>' : `<span class="badge">${PHASES[ph.block]} block</span>`}
        <span class="badge">${GOALS[S.profile.goal]}</span>
        <span class="badge">${plan.exercises.length} exercises</span>
        <span class="badge">~${est} min lifting</span>
        ${log.completed ? '<span class="badge ok">Completed ✓</span>' : ''}
      </div>
      <div class="progress" aria-hidden="true"><i id="wkBar" style="width:${total ? done / total * 100 : 0}%"></i></div>
      <span class="small muted" id="wkCount">${done} / ${total} ${t('today.sets')}</span>
    </section>
    ${painNote()}
    <div class="alert info">${icon('info')}<div><strong>${ph.name}.</strong> ${ph.desc}</div></div>

    <section>
      <h2 class="sec-title"><span class="n">1</span>${t('today.warmup')} <small>5–10 min</small></h2>
      <div class="card"><ul class="list">${plan.warmup.map(w => `<li>${esc(w)}</li>`).join('')}</ul></div>
    </section>

    <section>
      <h2 class="sec-title"><span class="n">2</span>${t('today.workout')} <small>${t('today.tick')}</small></h2>
      <div class="ex-stack">${plan.exercises.map((it, i) => exerciseCard(it, i, log)).join('')}</div>
    </section>

    <section>
      <h2 class="sec-title"><span class="n">3</span>${esc(plan.finisher.title)} <small>${plan.finisher.time}</small></h2>
      <div class="card"><ul class="list">${plan.finisher.items.map(w => `<li>${esc(w)}</li>`).join('')}</ul></div>
    </section>

    <section>
      <h2 class="sec-title"><span class="n">4</span>${t('today.cooldown')} <small>5 min</small></h2>
      <div class="card"><ul class="list">${plan.cooldown.map(w => `<li>${esc(w)}</li>`).join('')}</ul></div>
    </section>

    <div class="wk-footer">
      ${log.completed
        ? `<button class="btn btn-lg btn-block" type="button" data-action="unfinish">${t('today.done')}</button>`
        : `<button class="btn btn-primary btn-lg btn-block" type="button" data-action="finish" id="finishBtn">${t('today.finish')}</button>`}
      ${painNote()}
    </div>`;
}

function exerciseCard(item, i, log) {
  const { ex, rx, role, orig } = item;
  const saved = ((log.sets || {})[ex.id]) || [];
  const last = lastPerformance(ex.id, viewDate);
  const sug = suggestion(ex, rx, last);
  const noLoad = ex.equip === 'bodyweight' || ex.equip === 'band';
  const wPh = noLoad ? (ex.equip === 'band' ? 'band' : 'BW') : (sug.next ? String(sug.next) : 'kg');
  const complete = saved.length >= rx.sets && saved.slice(0, rx.sets).every(s => s && s.done);
  const rows = Array.from({ length: rx.sets }, (_, s) => {
    const v = saved[s] || {};
    const common = `data-ex="${ex.id}" data-set="${s}" data-sets="${rx.sets}"`;
    return `<div class="set-row${v.done ? ' done' : ''}">
      <span class="set-n">${s + 1}</span>
      <input class="num" type="text" inputmode="decimal" autocomplete="off" aria-label="${esc(ex.name)} set ${s + 1} weight in kg" placeholder="${wPh}" value="${esc(v.w || '')}" data-log="w" ${common}>
      <input class="num" type="text" inputmode="numeric" autocomplete="off" aria-label="${esc(ex.name)} set ${s + 1} ${rx.timed ? 'seconds' : 'reps'}" placeholder="${rx.target}" value="${esc(v.r || '')}" data-log="r" ${common}>
      <button class="rest-btn" type="button" data-action="rest" data-sec="${rx.rest}" data-label="${esc(ex.name)} · rest" aria-label="Start ${rx.rest} second rest timer">${icon('timer')}</button>
      <label class="check"><input type="checkbox" data-done ${common} data-rest="${rx.rest}" data-name="${esc(ex.name)}" data-next="${esc(rx.ssNext || '')}" ${v.done ? 'checked' : ''} aria-label="Mark ${esc(ex.name)} set ${s + 1} done"><span>${icon('check', 28)}</span></label>
    </div>
    <div class="rpe-row" role="group" aria-label="How hard was set ${s + 1}?"><span title="RPE 10 = no reps left · 8 = 2 reps left · 6 = 4+ left">${t('set.effort')}</span>${[6, 7, 8, 9, 10].map(n => `<button type="button" class="rpe${+v.rpe === n ? ' on' : ''}" data-action="set-rpe" ${common} data-v="${n}" aria-pressed="${+v.rpe === n}">${n}</button>`).join('')}</div>`;
  }).join('');
  const alt = alternatives(ex);
  const altBox = (label, e, fallback) => `<div class="alt"><span class="eyebrow">${label}</span>${e
    ? `<strong>${esc(e.name)}</strong><span class="small muted">${EQUIP_LABELS[e.equip]} · ${LEVEL_LABELS[e.level]}</span>
       <div class="row"><button class="btn btn-sm" type="button" data-action="exinfo" data-id="${e.id}">How to</button>${canUse(e) ? `<button class="btn btn-sm" type="button" data-action="swap" data-orig="${orig}" data-alt="${e.id}">${icon('swap', 16)} Swap in</button>` : `<span class="small muted">Needs ${EQUIP_LABELS[e.equip].toLowerCase()}</span>`}</div>`
    : `<span class="small muted">${fallback}</span>`}</div>`;
  return `<article class="ex-card${complete ? ' complete' : ''}" id="ex-${ex.id}">
    <div class="ex-head">
      <button class="ex-icon" type="button" data-action="exinfo" data-id="${ex.id}" aria-label="Watch ${esc(ex.name)} demo">${exSVG(ex, { animate: true, paused: reducedMotion(), tempo: rx.tempo })}<span class="play">${icon('play', 12)}</span></button>
      <div><div class="ex-role">${item.ss ? `<span class="ss-tag">Superset ${item.ss}</span> ` : ''}${i + 1} · ${role === 'M' ? 'Main lift' : 'Accessory'}</div><h3>${esc(ex.name)}</h3><div class="small muted">${esc(ex.primary)}</div></div>
      <button class="icon-btn" type="button" data-action="exinfo" data-id="${ex.id}" aria-label="How to do ${esc(ex.name)}">${icon('info')}</button>
    </div>
    <div class="chips">
      <span class="chip big">${rxText(rx)}</span>
      <span class="chip">Rest ${fmtRest(rx.rest)}</span>
      <span class="chip">RPE ${rx.rpe}</span>
      <span class="chip" title="Tempo: lower – pause – lift – pause (seconds)">Tempo ${rx.tempo}</span>
      ${rx.timed ? '' : `<span class="chip">Range ${rx.lo}–${rx.hi}</span>`}
      ${ex.equip === 'barbell' ? `<button class="chip chip-btn" type="button" data-action="plates" data-w="${sug.next || ''}">Plates</button>` : ''}
    </div>
    ${rx.ssNext ? `<div class="alert info small">${icon('bolt')}<div><strong>Superset:</strong> after each set go straight to <strong>${esc(rx.ssNext)}</strong> (15 s), then rest.</div></div>` : ''}
    <div class="hint${sug.flag ? ' flag-' + sug.flag : ''}">${sug.summary ? `<strong>${esc(sug.summary)}</strong>` : ''}<span>${sug.flag === 'up' ? '▲ ' : sug.flag === 'down' || sug.flag === 'stall' ? '▼ ' : ''}${esc(sug.tip)}</span>${last || !/^Find a weight/.test(rx.note) ? `<span>${esc(rx.note)}</span>` : ''}</div>
    <div class="sets">
      <div class="set-head"><span>${t('set.set')}</span><span>${t('set.kg')}</span><span>${rx.timed ? t('set.sec') : t('set.reps')}</span><span>${t('set.rest')}</span><span>${t('set.done')}</span></div>
      ${rows}
    </div>
    <details class="more">
      <summary>Muscles, form cues & alternatives ${icon('right', 18)}</summary>
      <div class="more-body">
        <div class="ex-muscles"><div class="mm-wrap">${muscleMapSVG(ex, { noArrow: true })}</div>${muscleLegend(ex)}</div>
        <div><strong class="small">3 form cues</strong><ul class="list">${ex.cues.map(c => `<li>${esc(c)}</li>`).join('')}</ul></div>
        <div class="mistake"><strong>Common mistake:</strong> ${esc(ex.mistake)}</div>
        <div class="alt-grid">
          ${altBox('Easier', alt.easier, 'Use 10–20% less load, a shorter range of motion, or a supported version (bench, machine, wall).')}
          ${altBox('Harder', alt.harder, 'Add a 2–3 s pause at the hardest point, or a slow 4 s lowering phase.')}
        </div>
        ${ex.id !== orig ? `<button class="btn btn-sm" type="button" data-action="swap" data-orig="${orig}" data-alt="${orig}">${icon('swap', 16)} Restore ${esc(EX[orig].name)}</button>` : ''}
      </div>
    </details>
  </article>`;
}

function restDayView(plan) {
  const rec = (S.logs[viewDate] || {}).recovery || [];
  let next = '';
  if (plan.week) {
    for (let i = 1; i <= 7; i++) {
      const ds = iso(addDays(parseISO(viewDate), i)), np = dayPlan(ds);
      if (np.status === 'train') { next = `<a class="card row-between" href="#/today/${ds}" style="text-decoration:none"><div><div class="eyebrow">Next workout · ${fmtDate(parseISO(ds))}</div><strong>${esc(np.title)}</strong></div>${icon('right')}</a>`; break; }
    }
  }
  return `
    ${plan.week ? `<section class="wk-head"><div class="eyebrow">Week ${plan.week} · Rest day${plan.deload ? ' · Deload week' : ''}</div><h1>Active Recovery</h1><p class="muted">Muscles grow between sessions. Keep moving gently today – tick things off as you go.</p></section>` : ''}
    <section class="stack">${RECOVERY.map((r, i) => `<label class="check-item"><input type="checkbox" data-recov="${i}" ${rec[i] ? 'checked' : ''}><span class="box">${icon('check', 22)}</span><span><strong>${r.t}</strong><br><span class="muted small">${r.d}</span></span></label>`).join('')}</section>
    ${next}
    ${painNote()}`;
}

/* ---------- WEEKLY PLAN ---------- */
function viewPlan(arg) {
  const p = S.profile, cur = currentWeek();
  const w = clamp(parseInt(arg, 10) || cur, 1, 12);
  const ph = phaseInfo(w), today = todayISO();
  const chips = Array.from({ length: 12 }, (_, i) => i + 1).map(n => `<a class="wk-chip${n === w ? ' active' : ''}${isDeload(n) ? ' deload' : ''}${n === cur ? ' current' : ''}" href="#/plan/${n}" aria-label="Week ${n}${isDeload(n) ? ' (deload)' : ''}">W${n}</a>`).join('');
  const days = Array.from({ length: 7 }, (_, i) => {
    const ds = iso(addDays(parseISO(p.startDate), (w - 1) * 7 + i)), pl = dayPlan(ds), log = S.logs[ds] || {};
    const head = `<div class="day-top"><div><div class="eyebrow">${fmtDate(parseISO(ds), { weekday: 'long' })}</div><span class="small muted">${fmtDate(parseISO(ds), { day: 'numeric', month: 'short' })}</span></div><div class="row">${ds === today ? '<span class="badge accent">Today</span>' : ''}${log.completed ? '<span class="badge ok">Done ✓</span>' : ''}</div></div>`;
    if (pl.status === 'moved') return `<article class="card day-card rest">${head}<h3>Moved → ${fmtDate(parseISO(pl.to))}</h3><p class="small muted">This session was rescheduled.</p></article>`;
    if (pl.status !== 'train') return `<article class="card day-card rest">${head}<h3>Rest · Active recovery</h3><p class="small muted">Walk, mobility and stretching.</p></article>`;
    return `<article class="card day-card${ds === today ? ' is-today' : ''}">${head}
      <h3>Day ${pl.dayNum} · ${esc(pl.title)}</h3>
      <ul class="mini-list">${pl.exercises.map(it => `<li><span>${it.ss ? `<b class="hl">${it.ss}</b> ` : ''}${esc(it.ex.name)}</span><span>${rxText(it.rx)}</span></li>`).join('')}</ul>
      <p class="small muted">+ ${esc(pl.finisher.title.toLowerCase())} (${pl.finisher.time})</p>
      <a class="btn btn-block" href="#/today/${ds}">Open workout ${icon('right', 18)}</a>
    </article>`;
  }).join('');
  app.innerHTML = `<div class="page">
    <section class="stack-s"><div class="eyebrow">${SPLIT_NAMES[p.days]} · ${GOALS[p.goal]}</div><h1>Weekly Plan</h1></section>
    <section class="card stack">
      <div class="row-between"><strong>12-week overview</strong><span class="small muted">Started ${fmtShort(p.startDate)}</span></div>
      <div class="phase-track" aria-hidden="true">${Array.from({ length: 12 }, (_, i) => `<i class="${i + 1 < cur ? 'done' : isDeload(i + 1) ? 'deload' : ''}${i + 1 === cur ? ' cur' : ''}"></i>`).join('')}</div>
      <div class="legend"><span><i style="background:var(--accent)"></i>Completed weeks</span><span><i style="background:color-mix(in srgb,var(--warn) 55%,transparent)"></i>Deload (4, 8, 12)</span></div>
    </section>
    <nav class="wk-chips" aria-label="Choose week">${chips}</nav>
    <div class="alert ${ph.deload ? 'danger' : 'info'}">${icon(ph.deload ? 'alert' : 'info')}<div><strong>Week ${w} – ${ph.name}.</strong> ${ph.desc}</div></div>
    <div class="grid-2">${days}</div>
  </div>`;
  const active = $('.wk-chip.active');
  if (active) active.scrollIntoView({ block: 'nearest', inline: 'center' });
}

/* ---------- EXERCISE LIBRARY ---------- */
const LIB = { q: '', group: '', equip: '', level: '' };
function viewLibrary() {
  const sel = (key, label, map) => `<select class="input" data-lib="${key}" aria-label="Filter by ${label.toLowerCase()}"><option value="">All ${label.toLowerCase()}</option>${Object.entries(map).map(([k, v]) => `<option value="${k}" ${String(LIB[key]) === k ? 'selected' : ''}>${v}</option>`).join('')}</select>`;
  app.innerHTML = `<div class="page">
    <section class="stack-s"><div class="eyebrow">${EXERCISE_DB.length} exercises</div><h1>Exercise Library</h1><p class="muted">Search and filter, then tap any card for step-by-step instructions, cues and alternatives.</p></section>
    <section class="card filters">
      <input id="libQ" class="input search" type="search" placeholder="Search exercises or muscles…" value="${esc(LIB.q)}" aria-label="Search exercises">
      ${sel('group', 'Muscles', MUSCLE_GROUPS)}${sel('equip', 'Equipment', EQUIP_LABELS)}${sel('level', 'Levels', LEVEL_LABELS)}
    </section>
    <div class="row-between"><span class="small muted" id="libCount"></span><button class="btn btn-sm" type="button" data-action="lib-reset">Clear filters</button></div>
    <div class="lib-grid" id="libGrid"></div>
  </div>`;
  renderLibGrid();
}
function renderLibGrid() {
  const q = LIB.q.trim().toLowerCase();
  const list = EXERCISE_DB.filter(e =>
    (!LIB.group || e.group === LIB.group) && (!LIB.equip || e.equip === LIB.equip) && (!LIB.level || e.level === +LIB.level) &&

/* ---------- weekly sets per muscle group ---------- */
const VOLUME_GROUPS = { chest: ['chest'], back: ['lats', 'midback', 'traps'], shoulders: ['frontdelt', 'sidedelt', 'reardelt'], biceps: ['biceps'], triceps: ['triceps'], quads: ['quads'], hamstrings: ['hamstrings'], glutes: ['glutes'], calves: ['calves'], core: ['abs', 'obliques', 'lowerback'] };
const VOLUME_LABELS = { chest: 'Chest', back: 'Back', shoulders: 'Shoulders', biceps: 'Biceps', triceps: 'Triceps', quads: 'Quads', hamstrings: 'Hamstrings', glutes: 'Glutes', calves: 'Calves', core: 'Core' };
function setCredit(ex) {
  const { primary, secondary } = exerciseMuscles(ex), out = {};
  Object.entries(VOLUME_GROUPS).forEach(([g, ids]) => {
    if (ids.some(i => primary.includes(i))) out[g] = 1;
    else if (ids.some(i => secondary.includes(i))) out[g] = 0.5;
  });
  return out;
}
function weeklyVolume(mondayISO) {
  const done = {}, planned = {};
  Object.keys(VOLUME_GROUPS).forEach(g => { done[g] = 0; planned[g] = 0; });
  for (let i = 0; i < 7; i++) {
    const ds = iso(addDays(parseISO(mondayISO), i)), log = S.logs[ds], pl = dayPlan(ds);
    if (log) Object.entries(log.sets || {}).forEach(([id, arr]) => {
      if (!EX[id]) return;
      const n = (arr || []).filter(x => x && x.done).length, c = setCredit(EX[id]);
      Object.entries(c).forEach(([g, k]) => { done[g] += n * k; });
    });
    if (pl.status === 'train') pl.exercises.forEach(it => Object.entries(setCredit(it.ex)).forEach(([g, k]) => { planned[g] += it.rx.sets * k; }));
  }
  return { done, planned };
}
let volWeek = 0;   // 0 = this week, -1 = last week …
function renderVolume() {
  const box = $('#volume');
  if (!box) return;
  const mon = iso(addDays(mondayOf(new Date()), volWeek * 7)), v = weeklyVolume(mon), MAX = 25;
  const rows = Object.keys(VOLUME_GROUPS).map(g => {
    const d = Math.round(v.done[g] * 2) / 2, pl = Math.round(v.planned[g] * 2) / 2;
    const status = d >= 10 && d <= 20 ? 'ok' : d > 20 ? 'high' : 'low';
    return `<div class="vol-row"><span class="vol-l">${VOLUME_LABELS[g]}</span>
      <div class="vol-track" title="Target zone 10–20 hard sets per week"><i class="vol-zone"></i><i class="vol-plan" style="width:${Math.min(pl, MAX) / MAX * 100}%"></i><i class="vol-done ${status}" style="width:${Math.min(d, MAX) / MAX * 100}%"></i></div>
      <span class="vol-n">${d}<small>/${pl}</small></span></div>`;
  }).join('');
  box.innerHTML = `<div class="row-between"><h2>Weekly sets per muscle</h2>
      <div class="row"><button class="icon-btn" type="button" data-action="vol-week" data-d="-1" aria-label="Previous week">${icon('left')}</button><strong style="min-width:110px;text-align:center">${volWeek === 0 ? 'This week' : volWeek === -1 ? 'Last week' : 'Week of ' + fmtShort(mon)}</strong><button class="icon-btn" type="button" data-action="vol-week" data-d="1" aria-label="Next week" ${volWeek >= 0 ? 'disabled' : ''}>${icon('right')}</button></div></div>
    <p class="small muted">Completed sets (main muscle = 1 set, helper muscle = ½) vs. planned. Most people grow best with <strong>10–20 hard sets per muscle per week</strong> – the shaded zone.</p>
    <div class="vol-list">${rows}</div>
    <div class="legend"><span><i style="background:var(--accent)"></i>Done (in zone)</span><span><i style="background:var(--warn)"></i>Below / above zone</span><span><i style="background:var(--surface-3)"></i>Planned</span></div>`;
}

function chartTheme() {
  const cs = getComputedStyle(document.documentElement);
  const v = n => cs.getPropertyValue(n).trim();
  const light = S.settings.theme === 'light';
  return { text: v('--muted'), grid: v('--border'), accent: v('--accent-text'),
    lines: light ? [v('--accent-text'), '#0B6BCB', '#D92D20', '#A15C00', '#7A3FD1'] : [v('--accent-text'), '#4CC9F0', '#FF6B6B', '#FFB224', '#B79CFF'] };
}
function chartOptions(c, unit) {
  return {
    responsive: true, maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false },
    plugins: {
      legend: { labels: { color: c.text, boxWidth: 12, boxHeight: 12, font: { family: 'Inter', weight: '600' } } },
      tooltip: { callbacks: { label: ctx => ctx.parsed.y == null ? '' : `${ctx.dataset.label}: ${roundTo(ctx.parsed.y, 0.5)} ${unit}` } },
    },
    scales: {
      x: { ticks: { color: c.text, maxRotation: 0, autoSkip: true, maxTicksLimit: 6 }, grid: { color: c.grid, display: false } },
      y: { ticks: { color: c.text }, grid: { color: c.grid } },
    },
  };
}
const emptyChart = msg => `<div class="empty-chart">${msg}</div>`;
function drawWeightChart(pts) {
  const el = $('#weightChart');
  if (!el) return;
  if (!pts.length) { el.parentNode.innerHTML = emptyChart('Save your first check-in to see your body-weight trend.'); return; }
  if (!window.Chart) { el.parentNode.innerHTML = emptyChart('Charts need an internet connection to load Chart.js.'); return; }
  const c = chartTheme();
  const datasets = [{ label: 'Body weight', data: pts.map(m => m.weight), borderColor: c.accent, backgroundColor: c.accent, borderWidth: 3, tension: 0.3, pointRadius: 4 }];
  if (S.profile.targetWeight) datasets.push({ label: 'Target', data: pts.map(() => S.profile.targetWeight), borderColor: c.text, backgroundColor: c.text, borderDash: [6, 6], borderWidth: 2, pointRadius: 0 });
  charts.weight = new Chart(el, { type: 'line', data: { labels: pts.map(m => fmtShort(m.date)), datasets }, options: chartOptions(c, 'kg') });
}
function drawStrengthChart(sd) {
  const el = $('#strengthChart');
  if (!el) return;
  const keys = Object.keys(KEY_LIFTS).filter(k => Object.keys(sd[k]).length);
  if (!keys.length) { el.parentNode.innerHTML = emptyChart('Log weights and reps on squat, bench, deadlift, hip thrust or row variations to see strength trends.'); return; }
  if (!window.Chart) { el.parentNode.innerHTML = emptyChart('Charts need an internet connection to load Chart.js.'); return; }
  const c = chartTheme();
  const dates = [...new Set(keys.flatMap(k => Object.keys(sd[k])))].sort();
  const datasets = keys.map(k => {
    const color = c.lines[Object.keys(KEY_LIFTS).indexOf(k)];
    return { label: KEY_LIFTS[k], data: dates.map(d => sd[k][d] ? roundTo(sd[k][d].v, 0.5) : null), borderColor: color, backgroundColor: color, borderWidth: 3, tension: 0.3, pointRadius: 4, spanGaps: true };
  });
  charts.strength = new Chart(el, { type: 'line', data: { labels: dates.map(fmtShort), datasets }, options: chartOptions(c, 'kg') });
}
function destroyCharts() { Object.keys(charts).forEach(k => { try { charts[k].destroy(); } catch (e) {} delete charts[k]; }); }

function renderCalendar() {
  const box = $('#calendar');
  if (!box) return;
  if (!calMonth) { const n = new Date(); calMonth = new Date(n.getFullYear(), n.getMonth(), 1); }
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const lead = (new Date(y, m, 1).getDay() + 6) % 7, count = new Date(y, m + 1, 0).getDate(), today = todayISO();
  let cells = WEEKDAYS.map(d => `<div class="dh" aria-hidden="true">${d.slice(0, 2)}</div>`).join('');
  for (let i = 0; i < lead; i++) cells += '<div class="d empty"></div>';
  for (let dd = 1; dd <= count; dd++) {
    const ds = iso(new Date(y, m, dd)), s = scheduleFor(ds), log = S.logs[ds] || {};
    const cls = ['d'];
    let state = '';
    if (log.completed) { cls.push('done'); state = ', workout completed'; }
    else if (s.status === 'train') { cls.push(ds < today ? 'missed' : 'sched'); state = ds < today ? ', missed workout' : ', training day'; }
    if ((log.recovery || []).some(Boolean)) { cls.push('recov'); state += ', recovery logged'; }
    if (ds === today) cls.push('today');
    cells += `<a class="${cls.join(' ')}" href="#/today/${ds}" aria-label="${fmtDate(parseISO(ds), { day: 'numeric', month: 'long' })}${state}">${dd}</a>`;
  }
  box.innerHTML = `<div class="row-between"><h2>Training calendar</h2>
      <div class="row"><button class="icon-btn" type="button" data-action="cal" data-d="-1" aria-label="Previous month">${icon('left')}</button>
      <strong style="min-width:120px;text-align:center">${calMonth.toLocaleDateString('en-IN', { month: 'long', year: 'numeric' })}</strong>
      <button class="icon-btn" type="button" data-action="cal" data-d="1" aria-label="Next month">${icon('right')}</button></div></div>
    <div class="cal">${cells}</div>
    <div class="legend"><span><i style="background:var(--accent)"></i>Completed</span><span><i style="box-shadow:inset 0 0 0 2px var(--surface-3)"></i>Planned</span><span><i style="box-shadow:inset 0 0 0 2px var(--danger)"></i>Missed</span><span><i style="background:var(--ok);border-radius:50%"></i>Recovery</span></div>`;
}

/* ---------------------------------------------------------------------
   ROUTER
   --------------------------------------------------------------------- */
const VIEWS = { home: viewHome, onboarding: viewOnboarding, today: viewToday, plan: viewPlan, library: viewLibrary, progress: viewProgress, nutrition: viewNutrition, profile: viewProfile };
const TITLES = { home: 'MuscularMen', onboarding: 'Get started', today: 'Today', plan: 'Weekly Plan', library: 'Exercise Library', progress: 'Progress', nutrition: 'Nutrition', profile: 'Profile' };
const OPEN_ROUTES = ['home', 'onboarding', 'library'];
function parseRoute() {
  const h = location.hash.replace(/^#\/?/, '');
  const [r, ...rest] = h.split('/');
  return { r: VIEWS[r] ? r : 'home', arg: rest.join('/') };
}
function router() {
  const next = parseRoute();
  if (!S.profile && !OPEN_ROUTES.includes(next.r)) { location.replace('#/onboarding'); return; }
  const changed = next.r !== route.r || next.arg !== route.arg;
  route = next;
  render();
  if (changed) { window.scrollTo(0, 0); app.focus({ preventScroll: true }); }
}
function render() {
  destroyCharts();
  VIEWS[route.r](route.arg);
  updateNavActive(route.r);
  document.title = route.r === 'home' ? 'MuscularMen' : `${TITLES[route.r] || t('nav.' + route.r)} · MuscularMen`;
}
/* Re-render the current page while keeping the scroll position */
function rerender() { const y = window.scrollY; render(); window.scrollTo(0, y); }

/* ---------------------------------------------------------------------
   7. EVENT HANDLING (delegated)
   --------------------------------------------------------------------- */
function ensureLog(date) {
  if (!S.logs[date]) {
    const pl = dayPlan(date);
    S.logs[date] = { dayKey: pl.dayKey || null, title: pl.title || 'Rest day', week: pl.week || null, sets: {}, completed: false };
  }
  S.logs[date].sets = S.logs[date].sets || {};
  return S.logs[date];
}
function ensureSets(entry, exId, n) {
  const arr = entry.sets[exId] || [];
  for (let i = 0; i < n; i++) if (!arr[i]) arr[i] = { w: '', r: '', done: false };
  entry.sets[exId] = arr;
  return arr;
}
function updateWorkoutProgress() {
  const boxes = $$('#app [data-done]'), done = boxes.filter(b => b.checked).length;
  const bar = $('#wkBar'), count = $('#wkCount');
  if (bar) bar.style.width = (boxes.length ? done / boxes.length * 100 : 0) + '%';
  if (count) count.textContent = `${done} / ${boxes.length} ${t('today.sets')}`;
  return { done, total: boxes.length };
}
function completeWorkout() {
  const entry = ensureLog(viewDate);
  entry.completed = true;
  entry.completedAt = new Date().toISOString();
  persist('logs');
  Timer.stop();
  const st = workoutStats();
  toast(`Workout complete! 🔥 Streak: ${st.streak}`, 3500);
  rerender();
}

function onSetToggle(cb) {
  const exId = cb.dataset.ex, idx = +cb.dataset.set;
  const entry = ensureLog(viewDate);
  const arr = ensureSets(entry, exId, +cb.dataset.sets);
  arr[idx].done = cb.checked;
  const row = cb.closest('.set-row');
  if (cb.checked) {
    // fill empty inputs from the suggestion/target placeholders
    $$('input[data-log]', row).forEach(inp => {
      if (!inp.value && /^\d+(\.\d+)?$/.test(inp.placeholder)) { inp.value = inp.placeholder; arr[idx][inp.dataset.log] = inp.value; }
    });
  }
  row.classList.toggle('done', cb.checked);
  if (cb.checked) checkPR(exId, idx, arr, row);
  const card = cb.closest('.ex-card');
  card.classList.toggle('complete', $$('[data-done]', card).every(c => c.checked));
  const { done, total } = updateWorkoutProgress();
  if (cb.checked && done === total && !entry.completed) { completeWorkout(); return; }
  persist('logs');
  if (cb.checked && S.settings.autoTimer) {
    const n = +cb.dataset.sets, nextSet = idx + 1 < n ? `${cb.dataset.name}, set ${idx + 2} of ${n}` : 'next exercise';
    const nextText = cb.dataset.next ? `Superset: go to ${cb.dataset.next}` : `Next: ${nextSet}`;
    Timer.start(+cb.dataset.rest, `${cb.dataset.name} · set ${idx + 1} done – rest`, nextText);
  }
}

/* Celebrate a new estimated-1RM record the moment a set is ticked */
function checkPR(exId, idx, arr, row) {
  const ex = EX[exId], x = arr[idx];
  if (!ex || ex.timed || !(num(x.w) > 0) || !(num(x.r) > 0)) return;
  const v = e1rm(num(x.w), num(x.r));
  let prev = 0;
  sessionBests(exId, iso(addDays(parseISO(viewDate), -1))).forEach(b => { prev = Math.max(prev, b.v); });
  arr.forEach((o, i) => { if (i !== idx && o && o.done && num(o.w) > 0 && num(o.r) > 0) prev = Math.max(prev, e1rm(num(o.w), num(o.r))); });
  if (prev && v > prev + 0.01) {
    row.classList.add('pr');
    toast(`🏆 New PR! ${ex.name}: ${x.w} kg × ${x.r} (≈${roundTo(v, 0.5)} kg 1RM)`, 4000);
    Voice.say(t('v.pr'));
  }
}

const ACTIONS = {
  'set-rpe'(el) {
    const entry = ensureLog(viewDate);
    const arr = ensureSets(entry, el.dataset.ex, +el.dataset.sets);
    const cur = arr[+el.dataset.set];
    cur.rpe = +cur.rpe === +el.dataset.v ? '' : +el.dataset.v;
    persist('logs');
    $$('button.rpe', el.parentNode).forEach(b => { const on = +b.dataset.v === +cur.rpe; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
  },
  'shift-missed'(el) {
    const p = S.profile, today = todayISO(), days = daysBetween(el.dataset.date, today);
    p.shifts = (p.shifts || []).concat({ from: today, days });
    p.moved = (p.moved || []).concat({ date: el.dataset.date, to: today });
    persist('profile'); planCache.clear();
    toast(`Done – today is now ${dayPlan(today).title || 'your missed workout'}. Plan moved back ${days} day(s).`);
    rerender();
  },
  'extra-deload'() {
    const p = S.profile, wk = currentWeek();
    p.extraDeloads = [...new Set((p.extraDeloads || []).concat(wk))];
    persist('profile'); planCache.clear();
    toast(`Week ${wk} is now a deload week – lighter loads, fewer sets.`);
    rerender();
  },
  'dismiss-fatigue'() { const p = S.profile; p.dismissedFatigue = (p.dismissedFatigue || []).concat(currentWeek()); persist('profile'); rerender(); },
  'reset-schedule'() {
    if (!confirm('Undo all moved workouts and extra deloads?')) return;
    Object.assign(S.profile, { shifts: [], moved: [], extraDeloads: [], dismissedFatigue: [] });
    persist('profile'); planCache.clear(); toast('Schedule reset'); rerender();
  },
  'ob-pick'(el) {
    const step = OB_STEPS[OB.step];
    OB.draft[step.key] = step.num ? +el.dataset.val : el.dataset.val;
    OB.touched = Object.assign({}, OB.touched, { [step.key]: true });
    OB.step = Math.min(OB.step + 1, OB_STEPS.length - 1);
    viewOnboarding(); window.scrollTo(0, 0);
  },
  'ob-back'() { OB.step = Math.max(0, OB.step - 1); viewOnboarding(); },
  'ob-skip'() { OB.step++; viewOnboarding(); },
  'ob-finish'() { finishOnboarding(); },
  rest(el) { Timer.start(+el.dataset.sec, el.dataset.label); },
  finish() { completeWorkout(); },
  unfinish() { const e = S.logs[viewDate]; if (e) { e.completed = false; persist('logs'); } rerender(); },
  exinfo(el) { openExercise(el.dataset.id); },
  'close-modal'() { closeModal(); },
  'demo-toggle'() {
    const fig = $('#demoStage .anim-fig');
    if (!fig) return;
    if (fig.dataset.paused === '1') delete fig.dataset.paused; else fig.dataset.paused = '1';
    syncDemoButton(fig);
  },
  'demo-slow'(el) { DEMO.slow = !DEMO.slow; openExercise(el.dataset.id); },
  'demo-mode'(el) { DEMO.mode = el.dataset.mode; openExercise(el.dataset.id); },
  'video-slow'(el) {
    const v = $('#demoStage video');
    if (!v) return;
    v.playbackRate = v.playbackRate === 1 ? 0.5 : 1;
    el.classList.toggle('active', v.playbackRate !== 1);
  },
  swap(el) {
    const { orig, alt } = el.dataset;
    S.profile.swaps = S.profile.swaps || {};
    if (orig === alt) delete S.profile.swaps[orig]; else S.profile.swaps[orig] = alt;
    persist('profile'); planCache.clear();
    if (!$('#modal').hidden) closeModal();
    toast(orig === alt ? `Restored ${EX[orig].name}` : `Swapped in ${EX[alt].name} for the rest of the program`);
    rerender();
  },
  'vol-week'(el) { volWeek = Math.min(0, volWeek + +el.dataset.d); renderVolume(); },
  cal(el) { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + +el.dataset.d, 1); renderCalendar(); },
  'del-measure'(el) {
    if (!confirm('Delete this check-in?')) return;
    S.measures = S.measures.filter(m => m.date !== el.dataset.date); persist('measures'); rerender();
  },
  'meal-tab'(el) { mealTab = el.dataset.tab; rerender(); },
  'lib-reset'() { Object.assign(LIB, { q: '', group: '', equip: '', level: '' }); viewLibrary(); },
  restart() {
    if (!confirm('Restart the 12-week program from this week? Your logs are kept.')) return;
    S.profile.startDate = iso(mondayOf(new Date())); persist('profile'); planCache.clear();
    toast('Program restarted – week 1 starts this Monday');
    location.hash = '#/today';
    if (route.r === 'today') rerender();
  },
  'rerun-ob'() { OB.step = 0; OB.draft = null; location.hash = '#/onboarding'; },
  export() {
    const data = { app: 'MuscularMen', version: 2, exportedAt: new Date().toISOString(), profile: S.profile, logs: S.logs, measures: S.measures, settings: S.settings, food: S.food || {} };
    const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
    const a = document.createElement('a');
    a.href = url; a.download = `muscularmen-backup-${todayISO()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  },
  'reset-all'() {
    if (!confirm('Delete ALL MuscularMen data on this device? This cannot be undone.')) return;
    Store.clearAll();
    S.profile = null; S.logs = {}; S.measures = []; S.settings = Object.assign({}, DEFAULT_SETTINGS);
    applyTheme(); planCache.clear(); Timer.stop();
    if (location.hash === '#/home') router(); else location.hash = '#/home';
    toast('All data deleted');
  },
};

function applyTheme() {
  document.documentElement.setAttribute('data-theme', S.settings.theme);
  const meta = $('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', S.settings.theme === 'light' ? '#F3F4F6' : '#0A0C0F');
  updateThemeIcon();
}
function setTheme(theme) {
  S.settings.theme = theme; persist('settings'); applyTheme();
  if (['progress', 'nutrition', 'profile'].includes(route.r)) rerender();   // charts & colour samples
}

function readForm(form) { return Object.fromEntries(new FormData(form).entries()); }
function validStat(v, min, max) { const n = num(v); return n !== null && n >= min && n <= max ? n : null; }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-t]');
  if (t && t.closest('#timer')) {
    const a = t.dataset.t;
    if (a === 'big') $('#timer').classList.toggle('big');
    else if (a === 'toggle') Timer.toggle();
    else if (a === 'skip') Timer.stop();
    else Timer.adjust(+a);
    return;
  }
  if (e.target === $('#modal')) { closeModal(); return; }
  const el = e.target.closest('[data-action]');
  if (el && ACTIONS[el.dataset.action]) { e.preventDefault(); ACTIONS[el.dataset.action](el, e); }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.matches('input[data-log]')) {
    const entry = ensureLog(viewDate);
    ensureSets(entry, t.dataset.ex, +t.dataset.sets)[+t.dataset.set][t.dataset.log] = t.value.trim();
    persistLogsSoon();
  } else if (t.id === 'libQ') { LIB.q = t.value; renderLibGrid(); }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('input[data-done]')) onSetToggle(t);
  else if (t.matches('input[data-recov]')) {
    const entry = ensureLog(viewDate);
    entry.recovery = entry.recovery || [];
    entry.recovery[+t.dataset.recov] = t.checked;
    persist('logs');
    if (t.checked && entry.recovery.filter(Boolean).length === RECOVERY.length) toast('Recovery day done – nice work 🌿');
  } else if (t.matches('select[data-lib]')) { LIB[t.dataset.lib] = t.value; renderLibGrid(); }
  else if (t.matches('input[data-setting]')) {
    const k = t.dataset.setting;
    if (k === 'light') setTheme(t.checked ? 'light' : 'dark');
    else {
      S.settings[k] = t.checked; persist('settings');
      if (k === 'voice' && t.checked) Voice.say(S.settings.lang === 'hi' ? 'वॉइस कोच चालू है' : 'Voice coach is on');
      if (k === 'notify' && t.checked && 'Notification' in window) {
        Notification.requestPermission().then(r => { if (r !== 'granted') { S.settings.notify = false; persist('settings'); t.checked = false; toast('Notifications are blocked in your browser settings.'); } });
      }
    }
  } else if (t.matches('select[data-setting-select]')) {
    S.settings[t.dataset.settingSelect] = t.value; persist('settings'); renderNav(); rerender();
  } else if (t.id === 'importFile' && t.files[0]) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data || !['MuscularMen', 'MuscularMen'].includes(data.app) || !data.profile) throw new Error('bad file');
        if (data.type === 'coach-plan') {
          // Program from a trainer: replace the training setup, keep logs and body stats
          const keep = S.profile ? { age: S.profile.age, height: S.profile.height, weight: S.profile.weight, targetWeight: S.profile.targetWeight, activity: S.profile.activity, diet: S.profile.diet } : {};
          S.profile = Object.assign({}, DEFAULT_PROFILE, data.profile, Object.fromEntries(Object.entries(keep).filter(([, v]) => v != null)));
          persist('profile'); planCache.clear(); toast(`Program from your coach loaded ✓ – starts ${fmtShort(S.profile.startDate)}`);
          location.hash = '#/plan'; return;
        }
        S.profile = data.profile; S.logs = data.logs || {}; S.measures = data.measures || []; S.settings = Object.assign({}, DEFAULT_SETTINGS, data.settings);
        ['profile', 'logs', 'measures', 'settings'].forEach(persist);
        if (data.food) { S.food = data.food; persist('food'); }
        planCache.clear(); applyTheme(); toast('Backup imported'); rerender();
      } catch (err) { toast('That file isn’t a MuscularMen backup.'); }
    };
    reader.readAsText(t.files[0]);
  }
});

document.addEventListener('submit', e => {
  const form = e.target;
  e.preventDefault();
  const d = readForm(form);
  if (form.id === 'obStats') {
    const vals = { age: validStat(d.age, 14, 90), height: validStat(d.height, 120, 230), weight: validStat(d.weight, 30, 300), targetWeight: validStat(d.targetWeight, 30, 300) };
    const bad = Object.entries(vals).filter(([k, v]) => d[k] !== '' && v === null).map(([k]) => k);
    if (bad.length) { toast('Please check: ' + bad.join(', ').replace('targetWeight', 'target weight')); return; }
    Object.assign(OB.draft, vals);
    OB.step++; viewOnboarding(); window.scrollTo(0, 0);
  } else if (form.id === 'measureForm') {
    const entry = { date: d.date && d.date <= todayISO() ? d.date : todayISO() };
    ['weight', 'waist', 'hips', 'neck', 'chest', 'arms'].forEach(k => { const v = validStat(d[k], 1, 400); if (v !== null) entry[k] = v; });
    if (Object.keys(entry).length === 1) { toast('Enter at least one measurement.'); return; }
    const i = S.measures.findIndex(m => m.date === entry.date);
    if (i >= 0) S.measures[i] = Object.assign({}, S.measures[i], entry); else S.measures.push(entry);
    persist('measures');
    if (entry.weight && entry.date === todayISO()) { S.profile.weight = entry.weight; persist('profile'); }
    toast('Check-in saved ✓'); rerender();
  } else if (form.id === 'nutriForm') {
    const vals = { age: validStat(d.age, 14, 90), height: validStat(d.height, 120, 230), weight: validStat(d.weight, 30, 300) };
    if (Object.values(vals).some(v => v === null)) { toast('Enter a valid age (14–90), height (120–230 cm) and weight (30–300 kg).'); return; }
    Object.assign(S.profile, vals, { activity: +d.activity });
    persist('profile'); rerender();
  } else if (form.id === 'profileForm') {
    const p = S.profile;
    Object.assign(p, { gender: d.gender, goal: d.goal, level: d.level, days: +d.days, session: +d.session, equipment: d.equipment, emphasis: d.emphasis, name: (d.name || '').trim().slice(0, 40), diet: d.diet || 'veg', injuries: new FormData(form).getAll('injuries') });
    ['age', 'height', 'weight', 'targetWeight'].forEach(k => {
      const lim = { age: [14, 90], height: [120, 230], weight: [30, 300], targetWeight: [30, 300] }[k];
      p[k] = d[k] === '' ? null : (validStat(d[k], lim[0], lim[1]) ?? p[k]);
    });
    if (/^\d{4}-\d{2}-\d{2}$/.test(d.startDate)) p.startDate = iso(mondayOf(parseISO(d.startDate)));
    persist('profile'); planCache.clear();
    toast('Profile saved – program updated');
    rerender();
  }
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('#modal').hidden) closeModal();
  else if ($('#timer').classList.contains('big')) $('#timer').classList.remove('big');
});

$('#themeBtn').addEventListener('click', () => setTheme(S.settings.theme === 'light' ? 'dark' : 'light'));
window.addEventListener('hashchange', router);
window.addEventListener('pagehide', () => persist('logs'));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Timer.iv) { Timer.tick(); Timer.keepAwake(); } });

/* ---------------------------------------------------------------------
   8. BOOT
   --------------------------------------------------------------------- */
function boot() {
  applyTheme();
  renderNav();
  // Offline support (service workers need http/https – not file://)
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (!location.hash) location.replace(S.profile ? '#/today' : '#/home');
  router();
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); window.__installPrompt = e; });
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
</script>
