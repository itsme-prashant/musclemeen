<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0C0F">
<meta name="description" content="MuscularMen – a daily workout guide and 12-week program for fat loss, muscle gain, recomposition and strength.">
<title>MuscularMen</title>
<link rel="icon" type="image/svg+xml" href="brand/logo-icon.svg">
<!-- Apply the saved theme before first paint (avoids a flash of the wrong theme) -->
<script>
  try { var s = JSON.parse(localStorage.getItem('tf_settings') || '{}'); if (s.theme === 'light') document.documentElement.setAttribute('data-theme', 'light'); } catch (e) {}
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Chart.js (progress charts). The app still works if it fails to load. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
<style>
/* =====================================================================
   DESIGN TOKENS – dark is the default, light via [data-theme="light"]
   ===================================================================== */
:root {
  --bg: #0A0C0F;
  --surface: #13161B;
  --surface-2: #1B1F26;
  --surface-3: #262B35;
  --border: #2A303A;
  --text: #F3F5F7;
  --muted: #98A2B3;
  --accent: #C6FF00;          /* fill colour for buttons, bars, chips  */
  --accent-ink: #0A0C0F;      /* text placed on top of --accent        */
  --accent-text: #C6FF00;     /* accent used as text on --bg/--surface */
  --accent-soft: rgba(198, 255, 0, .10);
  --danger: #FF6B6B;
  --danger-soft: rgba(255, 107, 107, .10);
  --warn: #FFB224;
  --ok: #3DDC97;
  --radius: 16px;
  --shadow: 0 10px 40px rgba(0, 0, 0, .45);
  --mm-body: #4A4F58;       /* muscle map: skin / body */
  --mm-muscle: #6E747E;     /* muscle not worked */
  --mm-line: #23272E;       /* muscle separations */
  --mm-primary: #FF4A2B;    /* main muscle */
  --mm-primary-2: #FF9A3C;
  --mm-secondary: #F2A65A;  /* helper muscles */
  --mm-arrow: #FFE11A;
  --nav-h: 68px;
  --font-display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #F3F4F6;
  --surface: #FFFFFF;
  --surface-2: #F1F3F6;
  --surface-3: #E3E7EC;
  --border: #DADFE6;
  --text: #0D1117;
  --muted: #586271;
  --accent: #C6FF00;
  --accent-ink: #0D1117;
  --accent-text: #477000;
  --accent-soft: rgba(110, 165, 0, .12);
  --danger: #D92D20;
  --danger-soft: rgba(217, 45, 32, .07);
  --warn: #A15C00;
  --ok: #08875D;
  --shadow: 0 10px 30px rgba(16, 24, 40, .12);
  --mm-body: #E6E8EC;
  --mm-muscle: #C7CBD2;
  --mm-line: #8A909A;
  --mm-secondary: #F6B47A;
  --mm-arrow: #F5D000;
  color-scheme: light;
}

/* =====================================================================
   BASE
   ===================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 8px);
  -webkit-tap-highlight-color: transparent;
}
body.timer-on main { padding-bottom: 200px; }
svg { display: block; flex-shrink: 0; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, h4 { font-family: var(--font-display); margin: 0; line-height: 1.05; }
h1 { font-size: clamp(2.1rem, 8vw, 3.3rem); font-weight: 800; text-transform: uppercase; }
h2 { font-size: 1.65rem; font-weight: 800; text-transform: uppercase; }
h3 { font-size: 1.35rem; font-weight: 700; }
p { margin: 0; }
ul, ol { margin: 0; }
:focus-visible { outline: 3px solid var(--accent-text); outline-offset: 2px; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.hl { color: var(--accent-text); }
.eyebrow { font-size: .76rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent-text); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-s { display: flex; flex-direction: column; gap: 6px; }

/* =====================================================================
   TOP BAR + NAVIGATION
   ===================================================================== */
.topbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 16px;
  height: 60px; padding: 0 16px;
  background: var(--bg);
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
}
.logo { display: flex; align-items: center; gap: 8px; text-decoration: none; font-family: var(--font-display); font-weight: 800; font-size: 1.45rem; letter-spacing: .02em; }
.logo b { color: var(--accent-text); }
.logo-mark { width: 34px; height: 34px; color: var(--accent-text); display: grid; place-items: center; }
.topnav { display: none; gap: 2px; margin-left: auto; }
.topnav a { padding: 8px 12px; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: .95rem; color: var(--muted); }
.topnav a:hover { color: var(--text); background: var(--surface-2); }
.topnav a.active { color: var(--accent-ink); background: var(--accent); }
.top-actions { display: flex; gap: 8px; margin-left: auto; }
.icon-btn {
  width: 44px; height: 44px; flex-shrink: 0;
  display: grid; place-items: center;
  border-radius: 12px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text); text-decoration: none;
}
.icon-btn:hover { background: var(--surface-2); }
.bottomnav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  display: grid; grid-template-columns: repeat(5, 1fr);
  height: calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  background: var(--surface); border-top: 1px solid var(--border);
}
.bottomnav a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; font-size: .72rem; font-weight: 600; color: var(--muted); }
.bottomnav a .pill { padding: 4px 16px; border-radius: 999px; }
.bottomnav a.active { color: var(--text); }
.bottomnav a.active .pill { background: var(--accent); color: var(--accent-ink); }
@media (min-width: 900px) {
  :root { --nav-h: 0px; }
  .topnav { display: flex; }
  .top-actions { margin-left: 8px; }
  .bottomnav { display: none; }
  body { padding-bottom: 24px; }
}

/* =====================================================================
   LAYOUT + COMPONENTS
   ===================================================================== */
main { max-width: 980px; margin: 0 auto; padding: 20px 16px 40px; outline: none; }
.page { display: flex; flex-direction: column; gap: 20px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; }
.card.flat { background: var(--surface-2); }
.grid { display: grid; gap: 12px; }
.grid-2 { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }
.grid-3 { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 20px;
  border-radius: 12px; border: 1px solid var(--border);
  background: var(--surface-2); color: var(--text);
  font-weight: 700; font-size: 1rem; text-decoration: none; white-space: nowrap;
  transition: transform .1s ease, background .15s ease;
}
.btn:hover { background: var(--surface-3); }
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn-primary:hover { background: var(--accent); filter: brightness(1.06); }
.btn-danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--border)); background: var(--danger-soft); }
.btn-lg { min-height: 58px; font-size: 1.1rem; padding: 0 26px; border-radius: 14px; }
.btn-sm { min-height: 40px; padding: 0 14px; font-size: .9rem; border-radius: 10px; }
.btn-block { width: 100%; }
.btn[disabled] { opacity: .45; pointer-events: none; }

.badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; font-size: .74rem; font-weight: 700; background: var(--surface-3); color: var(--text); white-space: nowrap; }
.badge.accent { background: var(--accent); color: var(--accent-ink); }
.badge.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.badge.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }

.alert { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; border: 1px solid; font-size: .94rem; }
.alert svg { margin-top: 2px; }
.alert.danger { background: var(--danger-soft); border-color: color-mix(in srgb, var(--danger) 40%, transparent); }
.alert.danger svg { color: var(--danger); }
.alert.info { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent-text) 30%, transparent); }
.alert.info svg { color: var(--accent-text); }

/* Forms */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: .84rem; font-weight: 600; color: var(--muted); }
.input {
  width: 100%; min-width: 0; height: 50px; padding: 0 14px;
  border-radius: 12px; border: 1px solid var(--border);
  background: var(--surface-2); font-size: 1rem;
}
select.input { appearance: none; -webkit-appearance: none; padding-right: 36px;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 20px) 22px, calc(100% - 14px) 22px; background-size: 6px 6px; background-repeat: no-repeat; }
.input:focus { outline: none; border-color: var(--accent-text); box-shadow: 0 0 0 3px var(--accent-soft); }
.form-grid { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 700px) { .form-grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.form-grid .full { grid-column: 1 / -1; }

/* Big custom checkbox used in checklists */
.check-item { display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: start; padding: 12px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--border); cursor: pointer; position: relative; }
.check-item input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.check-item .box { width: 40px; height: 40px; border-radius: 10px; border: 2px solid var(--border); background: var(--surface); display: grid; place-items: center; color: transparent; transition: .15s; }
.check-item input:checked + .box { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.check-item input:focus-visible + .box { outline: 3px solid var(--accent-text); outline-offset: 2px; }

/* Toggle switch */
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; cursor: pointer; }
.switch input { position: absolute; opacity: 0; }
.switch .track { width: 52px; height: 30px; border-radius: 99px; background: var(--surface-3); position: relative; flex-shrink: 0; transition: .2s; }
.switch .track::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--text); transition: .2s; }
.switch input:checked + .track { background: var(--accent); }
.switch input:checked + .track::after { transform: translateX(22px); background: var(--accent-ink); }
.switch input:focus-visible + .track { outline: 3px solid var(--accent-text); outline-offset: 2px; }

/* Progress bar */
.progress { height: 10px; background: var(--surface-3); border-radius: 99px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s ease; }

/* Stat tiles */
.stats { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 700px) { .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.stat .v { font-family: var(--font-display); font-size: 2.3rem; font-weight: 800; line-height: 1; }
.stat .v small { font-size: 1rem; color: var(--muted); font-weight: 700; }
.stat .l { font-size: .74rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .07em; }
.stat.accent { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.stat.accent .l, .stat.accent .v small { color: var(--accent-ink); opacity: .75; }

/* Tables */
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: .92rem; }
th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

/* =====================================================================
   HOME
   ===================================================================== */
.hero {
  position: relative; overflow: hidden;
  border-radius: 24px; padding: 34px 20px 30px;
  background: radial-gradient(120% 90% at 100% 0%, var(--accent-soft), transparent 60%), var(--surface);
  border: 1px solid var(--border);
}
.hero h1 { font-size: clamp(2.7rem, 12vw, 5.2rem); line-height: .92; margin: 10px 0 16px; position: relative; }
.hero p { max-width: 560px; color: var(--muted); font-size: 1.05rem; position: relative; }
.hero .ctas { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; position: relative; }
.hero .big-num { position: absolute; right: -12px; bottom: -70px; font-family: var(--font-display); font-weight: 800; font-size: 19rem; line-height: 1; color: var(--accent-text); opacity: .07; pointer-events: none; user-select: none; }
.feature { display: flex; gap: 14px; align-items: flex-start; }
.feature .ic { width: 44px; height: 44px; border-radius: 12px; background: var(--accent-soft); color: var(--accent-text); display: grid; place-items: center; flex-shrink: 0; }
.feature h3 { font-size: 1.2rem; margin-bottom: 2px; }
.steps-list { counter-reset: s; display: grid; gap: 12px; padding: 0; list-style: none; }
.steps-list li { counter-increment: s; display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: center; }
.steps-list li::before { content: counter(s); width: 44px; height: 44px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 1.4rem; }
.today-card { display: flex; flex-direction: column; gap: 14px; border-color: color-mix(in srgb, var(--accent-text) 45%, var(--border)); }

/* =====================================================================
   ONBOARDING
   ===================================================================== */
.ob { max-width: 640px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 22px; }
.ob-top { display: flex; align-items: center; gap: 12px; }
.ob-top .progress { flex: 1; height: 8px; }
.opts { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); }
.opt {
  display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
  min-height: 92px; padding: 16px 18px; text-align: left;
  border-radius: 18px; border: 2px solid var(--border); background: var(--surface);
  transition: border-color .15s, background .15s, transform .1s;
}
.opt:hover { border-color: var(--muted); }
.opt:active { transform: scale(.98); }
.opt strong { font-family: var(--font-display); font-size: 1.55rem; font-weight: 800; text-transform: uppercase; line-height: 1.05; }
.opt span { color: var(--muted); font-size: .9rem; }
.opt.selected { border-color: var(--accent); background: var(--accent-soft); }
.summary-list { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: .95rem; }
.summary-list dt { color: var(--muted); }
.summary-list dd { margin: 0; font-weight: 600; }
.radio-cards { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); }
.radio-card { position: relative; padding: 14px 16px; border-radius: 14px; border: 2px solid var(--border); background: var(--surface-2); cursor: pointer; }
.radio-card input { position: absolute; opacity: 0; }
.radio-card:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.radio-card:has(input:focus-visible) { outline: 3px solid var(--accent-text); outline-offset: 2px; }

/* =====================================================================
   TODAY / WORKOUT
   ===================================================================== */
.datebar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.datebar-mid { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.datebar-mid strong { font-size: 1.05rem; }
.datebar-mid a { font-size: .82rem; font-weight: 700; color: var(--accent-text); }
.wk-head { display: flex; flex-direction: column; gap: 10px; }
.wk-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sec-title { display: flex; align-items: center; gap: 10px; font-size: 1.45rem; margin-bottom: 12px; }
.sec-title .n { width: 32px; height: 32px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 1.1rem; flex-shrink: 0; }
.sec-title small { font-family: var(--font-body); font-size: .84rem; color: var(--muted); text-transform: none; font-weight: 600; margin-left: auto; }
.list { padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.list li::marker { color: var(--accent-text); }
.ex-stack { display: flex; flex-direction: column; gap: 14px; }
.ex-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 14px; transition: border-color .2s; }
.ex-card.complete { border-color: color-mix(in srgb, var(--accent-text) 60%, var(--border)); }
.ex-head { display: grid; grid-template-columns: 60px minmax(0, 1fr) 44px; gap: 12px; align-items: center; }
.ex-head h3 { font-size: 1.4rem; overflow-wrap: anywhere; }
.ex-icon { width: 60px; height: 60px; border-radius: 14px; background: var(--surface-2); color: var(--text); display: grid; place-items: center; }
.ex-icon svg { width: 52px; height: 52px; }
.ex-role { font-size: .72rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 6px 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); font-size: .88rem; font-weight: 600; white-space: nowrap; }
.chip.big { font-family: var(--font-display); font-size: 1.35rem; font-weight: 800; line-height: 1.1; background: var(--accent); color: var(--accent-ink); border-color: transparent; padding: 4px 12px; }
.hint { font-size: .88rem; color: var(--muted); background: var(--surface-2); padding: 10px 12px; border-radius: 12px; display: flex; flex-direction: column; gap: 2px; }
.hint strong { color: var(--text); }
.sets { display: flex; flex-direction: column; gap: 8px; }
.set-head, .set-row { display: grid; grid-template-columns: 30px minmax(0, 1fr) minmax(0, 1fr) 50px 56px; gap: 8px; align-items: center; }
.set-head { font-size: .7rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-align: center; }
.set-n { font-family: var(--font-display); font-weight: 800; font-size: 1.4rem; text-align: center; }
.set-row input.num {
  width: 100%; min-width: 0; height: 54px;
  border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2);
  text-align: center; font-size: 1.2rem; font-weight: 700;
}
.set-row input.num:focus { outline: none; border-color: var(--accent-text); box-shadow: 0 0 0 3px var(--accent-soft); }
.set-row.done input.num { color: var(--muted); }
.rest-btn { height: 54px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2); display: grid; place-items: center; color: var(--text); }
.check { position: relative; width: 56px; height: 54px; }
.check input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.check span { position: absolute; inset: 0; border-radius: 12px; border: 2px solid var(--border); background: var(--surface-2); display: grid; place-items: center; color: transparent; pointer-events: none; transition: .15s; }
.check input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.check input:focus-visible + span { outline: 3px solid var(--accent-text); outline-offset: 2px; }
details.more { border-top: 1px solid var(--border); padding-top: 4px; }
details.more summary { cursor: pointer; font-weight: 700; list-style: none; display: flex; align-items: center; justify-content: space-between; min-height: 48px; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary svg { transition: transform .2s; }
details.more[open] summary svg { transform: rotate(90deg); }
.more-body { display: flex; flex-direction: column; gap: 14px; padding-bottom: 6px; }

/* ---------- vector helpers ---------- */
const V = {
  add: (a, b) => [a[0] + b[0], a[1] + b[1]], sub: (a, b) => [a[0] - b[0], a[1] - b[1]],
  mul: (a, k) => [a[0] * k, a[1] * k], len: a => Math.hypot(a[0], a[1]),
  norm: a => { const l = Math.hypot(a[0], a[1]) || 1; return [a[0] / l, a[1] / l]; },
  lerp: (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k],
};
const f1 = n => (Math.round(n * 100) / 100).toString();
const P = p => `${f1(p[0])} ${f1(p[1])}`;
const poly = pts => 'M' + pts.map(P).join(' L') + 'Z';
function smooth(pts) {   // closed Catmull-Rom → Bézier
  const n = pts.length; let d = `M${P(pts[0])}`;
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
    d += ` C${P(V.add(p1, V.mul(V.sub(p2, p0), 1 / 6)))} ${P(V.sub(p2, V.mul(V.sub(p3, p1), 1 / 6)))} ${P(p2)}`;
  }
  return d + 'Z';
}

let rigSeq = 0;
function rigPose(key, k) {
  const r = RIG[key] || RIG.cond, out = {};
  Object.keys(r.A).forEach(j => { out[j] = V.lerp(r.A[j], (r.B || r.A)[j] || r.A[j], k); });
  return out;
}

/* Render the anatomy figure for an exercise at phase k (0 = pose A, 1 = pose B) */
function bodySVG(ex, k = 1, opts = {}) {
  const key = ex.icon || ex.pattern, rig = RIG[key] || RIG.cond, j = rigPose(key, k);
  const id = 'r' + (++rigSeq) + '_';
  const { primary, secondary } = typeof exerciseMuscles === 'function' ? exerciseMuscles(ex) : { primary: [], secondary: [] };
  const map = PART_MUSCLES[rig.view];
  const level = part => { const ms = map[part] || []; return ms.some(m => primary.includes(m)) ? 'primary' : ms.some(m => secondary.includes(m)) ? 'secondary' : 'base'; };
  const defs = [], back = [], mid = [], front = [];
  let gi = 0;

  const gradient = (stops, p, n, r) => {
    const g = id + (gi++), a = V.sub(p, V.mul(n, r)), b = V.add(p, V.mul(n, r));
    defs.push(`<linearGradient id="${g}" gradientUnits="userSpaceOnUse" x1="${f1(a[0])}" y1="${f1(a[1])}" x2="${f1(b[0])}" y2="${f1(b[1])}"><stop offset="0" stop-color="${stops[0]}"/><stop offset=".38" stop-color="${stops[1]}"/><stop offset=".72" stop-color="${stops[2]}"/><stop offset="1" stop-color="${stops[3]}"/></linearGradient>`);
    return `url(#${g})`;
  };
  /* Tapered capsule between two joints */
  const capsule = (out, p1, p2, r1, r2, depth) => {
    const d = V.norm(V.sub(p2, p1)), n = [-d[1], d[0]], pts = [];
    for (let i = 0; i <= 8; i++) { const a = Math.PI / 2 - Math.PI * i / 8; pts.push(V.add(p2, V.add(V.mul(d, Math.cos(a) * r2), V.mul(n, Math.sin(a) * r2)))); }
    for (let i = 0; i <= 8; i++) { const a = -Math.PI / 2 - Math.PI * i / 8; pts.push(V.add(p1, V.add(V.mul(d, Math.cos(a) * r1), V.mul(n, Math.sin(a) * r1)))); }
    out.push(`<path d="${poly(pts)}" fill="${gradient(SKIN[depth], V.lerp(p1, p2, 0.5), n, (r1 + r2) / 2)}" stroke="${OUTLINE}" stroke-width=".55" stroke-linejoin="round"/>`);
    return { d, n };
  };
  /* Muscle belly on one side (s = ±1) of a limb, optionally highlighted */
  const belly = (out, p1, p2, r1, r2, s, lvl, depth, t0 = 0.08, t1 = 0.92, bulge = 1) => {
    const d = V.norm(V.sub(p2, p1)), n = [-d[1], d[0]], L = V.len(V.sub(p2, p1));
    const outer = [], inner = [];
    for (let i = 0; i <= 10; i++) {
      const t = t0 + (t1 - t0) * i / 10, r = r1 + (r2 - r1) * t, sh = Math.pow(Math.sin(Math.PI * i / 10), 0.55);
      const base = V.add(p1, V.mul(d, t * L));
      outer.push(V.add(base, V.mul(n, s * r * (0.12 + 0.86 * sh) * bulge)));
      inner.push(V.add(base, V.mul(n, -s * r * 0.1 * sh)));
    }
    const pts = outer.concat(inner.reverse());
    const mid = V.add(V.lerp(p1, p2, 0.5), V.mul(n, s * (r1 + r2) / 4));
    out.push(`<path d="${smooth(pts)}" fill="${gradient(MUSCLE_FILL[lvl][depth], mid, V.mul(n, s), (r1 + r2) / 2)}" stroke="${OUTLINE}" stroke-width=".35" stroke-opacity=".8"/>`);
    if (lvl !== 'base') {   // muscle fibres
      [0.35, 0.65].forEach(f => {
        const a = V.add(V.add(p1, V.mul(d, (t0 + 0.12) * L)), V.mul(n, s * r1 * f * 0.8)), b = V.add(V.add(p1, V.mul(d, (t1 - 0.12) * L)), V.mul(n, s * r2 * f * 0.8));
        out.push(`<path d="M${P(a)} L${P(b)}" stroke="#5A0A04" stroke-opacity=".35" stroke-width=".35" stroke-linecap="round"/>`);
      });
    }
  };
  /* A full limb: capsule + front/back muscle bellies */
  const limb = (out, p1, p2, r1, r2, partF, partB, depth, frontSign, opts2 = {}) => {
    capsule(out, p1, p2, r1, r2, depth);
    if (partF) belly(out, p1, p2, r1, r2, frontSign, level(partF), depth, opts2.t0, opts2.t1, opts2.bf || 1);
    if (partB) belly(out, p1, p2, r1, r2, -frontSign, level(partB), depth, opts2.t0b ?? opts2.t0, opts2.t1b ?? opts2.t1, opts2.bb || 1);
  };
  const local = (H, u, v, L) => ([a, b]) => V.add(H, V.add(V.mul(u, a * L), V.mul(v, b * L)));
  const overlay = (out, shape, toG, lvl, depth = 'near') => {
    const pts = shape.map(toG), c = pts.reduce((s, p) => V.add(s, V.mul(p, 1 / pts.length)), [0, 0]);
    out.push(`<path d="${smooth(pts)}" fill="${gradient(MUSCLE_FILL[lvl][depth], c, [0.7, -0.7], 6)}" stroke="${OUTLINE}" stroke-width=".4" stroke-opacity=".8"/>`);
  };
  const head = (out, S, u, v, frontView) => {
    const c = V.add(S, V.add(V.mul(u, 10.5), V.mul(v, frontView ? 0 : 1.2)));
    const m = `matrix(${f1(v[0])} ${f1(v[1])} ${f1(-u[0])} ${f1(-u[1])} ${f1(c[0])} ${f1(c[1])})`;
    capsule(out, V.add(S, V.mul(u, 1)), V.add(S, V.mul(u, 7)), 3.1, 2.7, 'near');
    const skin = `url(#${id}head)`;   // bounding-box gradient: works inside the rotated head group
    if (!defs.some(d => d.includes(`${id}head`))) defs.push(`<linearGradient id="${id}head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9A9EA5"/><stop offset=".55" stop-color="#F2F3F4"/><stop offset="1" stop-color="#C9CCD1"/></linearGradient>`);
    out.push(frontView
      ? `<g transform="${m}"><ellipse rx="5.3" ry="6.5" fill="${skin}" stroke="${OUTLINE}" stroke-width=".55"/>
          <path d="M-5.3 -1.2 C-5.8 -8.4 5.8 -8.4 5.3 -1.2 C3.4 -5.2 -3.4 -5.2 -5.3 -1.2Z" fill="#4A4E55"/>
          <ellipse cx="-5.3" cy=".6" rx=".9" ry="1.5" fill="#B9BCC1" stroke="${OUTLINE}" stroke-width=".3"/><ellipse cx="5.3" cy=".6" rx=".9" ry="1.5" fill="#B9BCC1" stroke="${OUTLINE}" stroke-width=".3"/>

    const details = MM_DETAIL[name].map(d => `<path class="det" d="${d}"/>`).join('');
    const head = name === 'front'
      ? '<ellipse class="body" cx="100" cy="30" rx="16" ry="20"/><path class="det" d="M93 36 Q100 40 107 36"/>'
      : '<ellipse class="body" cx="100" cy="30" rx="16" ry="20"/><path class="det" d="M86 24 Q100 8 114 24"/>';
    return `<g transform="translate(${dx} 0)">
      <path class="body" d="${MM_BODY_PATH}"/>${head}
      ${mirror(muscles + details)}
      ${name === 'back' ? '<path class="det" d="M100 52 L100 196"/>' : ''}
      <text class="lbl" x="100" y="420">${name.toUpperCase()}</text>
    </g>`;
  };
  // yellow arrow on the main target muscle (drawn on the right side of the figure)
  let arrow = '';
  const target = primary.find(id => MM_ANCHOR[id]);
  if (target && !opts.noArrow) {
    const [v, x, y] = MM_ANCHOR[target];
    const ax = (v === 'front' ? 0 : 210) + (200 - x), ay = y;
    const sx = ax + 46, sy = ay + 40, ang = Math.atan2(ay - sy, ax - sx);
    const hx = ax - Math.cos(ang) * 2, hy = ay - Math.sin(ang) * 2;
    const tip = (a, r) => `${(hx - Math.cos(ang + a) * r).toFixed(1)},${(hy - Math.sin(ang + a) * r).toFixed(1)}`;
    const shaftEnd = `${(hx - Math.cos(ang) * 14).toFixed(1)} ${(hy - Math.sin(ang) * 14).toFixed(1)}`;
    arrow = `<path class="arrow-edge" d="M${sx} ${sy} L${shaftEnd}"/><path class="arrow" d="M${sx} ${sy} L${shaftEnd}"/>
      <polygon class="arrow-head" stroke="#000" stroke-opacity=".55" stroke-width="1.5" points="${hx.toFixed(1)},${hy.toFixed(1)} ${tip(0.5, 20)} ${tip(-0.5, 20)}"/>`;
  }
  return `<svg class="mm" viewBox="-6 0 422 428" role="img" aria-label="Muscles worked by ${esc(ex.name)}: ${esc(ex.primary)}">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--mm-primary)"/><stop offset="1" style="stop-color:var(--mm-primary-2)"/></linearGradient></defs>
    ${view('front', MM_FRONT, 0)}${view('back', MM_BACK, 210)}${arrow}
  </svg>`;
}
function muscleLegend(ex) {
  return `<div class="mm-legend"><span><i class="p"></i><strong>Primary:</strong> ${esc(ex.primary)}</span>${ex.secondary && ex.secondary !== '—' ? `<span><i class="s"></i><strong>Secondary:</strong> ${esc(ex.secondary)}</span>` : ''}</div>`;
}
const youtubeUrl = ex => 'https://www.youtube.com/results?search_query=' + encodeURIComponent(`${ex.name} exercise proper form`);
const levelDots = l => `<span class="dots" aria-label="${LEVEL_LABELS[l]}">${[1, 2, 3].map(i => `<i class="${i <= l ? 'on' : ''}"></i>`).join('')}</span>`;

/* ---------------------------------------------------------------------
   4. PROGRAM ENGINE
   --------------------------------------------------------------------- */

/* Split per training frequency, and which weekdays (0 = Mon) are training days */
const SPLITS = {
  3: ['fbA', 'fbB', 'fbC'],
  4: ['upperA', 'lowerA', 'upperB', 'lowerB'],
  5: ['upperA', 'lowerA', 'pushB', 'pullB', 'legsB'],
  6: ['pushA', 'pullA', 'legsA', 'pushB', 'pullB', 'legsB'],
};
const SPLIT_NAMES = { 3: 'Full Body ×3', 4: 'Upper / Lower', 5: 'Upper/Lower + Push/Pull/Legs', 6: 'Push / Pull / Legs ×2' };
const SCHEDULE = { 3: [0, 2, 4], 4: [0, 1, 3, 4], 5: [0, 1, 2, 4, 5], 6: [0, 1, 2, 3, 4, 5] };

/* Day templates: ordered slots [pattern, role (M = main lift, A = accessory), variant offset].
   Higher slots are kept first when the session is short. */
const PUSH = [['hpush', 'M'], ['vpush', 'M'], ['hpush', 'A', 1], ['latraise', 'A'], ['triceps', 'A'], ['fly', 'A'], ['triceps', 'A', 1], ['core', 'A']];
const PULL = [['vpull', 'M'], ['hpull', 'M'], ['hpull', 'A', 1], ['reardelt', 'A'], ['biceps', 'A'], ['biceps', 'A', 1], ['core', 'A'], ['hinge', 'A', 2]];
const LEGS = [['squat', 'M'], ['hinge', 'M', 1], ['lunge', 'A'], ['glute', 'A'], ['hamcurl', 'A'], ['quadiso', 'A'], ['calf', 'A'], ['core', 'A']];
const TEMPLATES = {
  fbA:    { type: 'fb', variant: 0, slots: [['squat', 'M'], ['hpush', 'M'], ['hpull', 'M'], ['glute', 'A'], ['latraise', 'A'], ['core', 'A'], ['triceps', 'A'], ['calf', 'A']] },
  fbB:    { type: 'fb', variant: 0, slots: [['hinge', 'M'], ['vpush', 'M'], ['vpull', 'M'], ['lunge', 'A'], ['fly', 'A'], ['hamcurl', 'A'], ['core', 'A', 1], ['biceps', 'A']] },
  fbC:    { type: 'fb', variant: 1, slots: [['squat', 'M'], ['hpull', 'M'], ['hpush', 'M'], ['glute', 'M'], ['reardelt', 'A'], ['core', 'A'], ['biceps', 'A'], ['triceps', 'A']] },
  upperA: { type: 'upper', variant: 0, slots: [['hpush', 'M'], ['hpull', 'M'], ['vpush', 'M'], ['vpull', 'A'], ['latraise', 'A'], ['triceps', 'A'], ['biceps', 'A'], ['core', 'A']] },
  upperB: { type: 'upper', variant: 1, slots: [['vpull', 'M'], ['hpush', 'M'], ['hpull', 'M'], ['fly', 'A'], ['reardelt', 'A'], ['biceps', 'A'], ['triceps', 'A'], ['core', 'A']] },
  lowerA: { type: 'lower', variant: 0, slots: [['squat', 'M'], ['hinge', 'M', 1], ['lunge', 'A'], ['hamcurl', 'A'], ['glute', 'A'], ['calf', 'A'], ['core', 'A'], ['quadiso', 'A']] },
  lowerB: { type: 'lower', variant: 0, slots: [['hinge', 'M'], ['glute', 'M'], ['lunge', 'A', 1], ['hamcurl', 'A', 1], ['abduct', 'A'], ['quadiso', 'A'], ['calf', 'A'], ['core', 'A', 1]] },
  pushA:  { type: 'push', variant: 0, slots: PUSH },
  pushB:  { type: 'push', variant: 1, slots: PUSH },
  pullA:  { type: 'pull', variant: 0, slots: PULL },
  pullB:  { type: 'pull', variant: 1, slots: PULL },
  legsA:  { type: 'legs', variant: 0, slots: LEGS },
  legsB:  { type: 'legs', variant: 1, slots: LEGS },
};
const REGION = { fb: 'full', upper: 'upper', lower: 'lower', push: 'upper', pull: 'upper', legs: 'lower' };

/* Extra slots inserted right after the main lifts, by emphasis */
const EMPHASIS_BONUS = {
  fb:    { lower: ['glute', 'core'], upper: ['hpush', 'latraise'] },
  upper: { lower: ['core'], upper: ['fly', 'latraise'] },
  lower: { lower: ['glute', 'abduct'], upper: [] },
  push:  { lower: ['core'], upper: ['fly'] },
  pull:  { lower: ['glute'], upper: ['reardelt'] },
  legs:  { lower: ['glute', 'abduct'], upper: [] },
};

/* Day titles: [balanced, lower emphasis, upper emphasis] */
const DAY_TITLES = {
  fbA: ['Full Body A – Squat & Press', 'Full Body A – Legs & Glutes', 'Full Body A – Chest & Back'],
  fbB: ['Full Body B – Hinge & Pull', 'Full Body B – Glutes & Hamstrings', 'Full Body B – Shoulders & Back'],
  fbC: ['Full Body C – Total Body', 'Full Body C – Glute Focus', 'Full Body C – Upper Focus'],
  upperA: ['Upper Body – Push Focus', 'Upper Body + Core', 'Upper Body – Chest & Shoulders'],
  upperB: ['Upper Body – Pull Focus', 'Upper Body – Posture & Core', 'Upper Body – Back & Arms'],
  lowerA: ['Lower Body – Squat Focus', 'Lower Body – Glute Focus', 'Lower Body – Squat Focus'],
  lowerB: ['Lower Body – Hinge Focus', 'Lower Body – Glutes & Hamstrings', 'Lower Body – Hinge Focus'],
  pushA: ['Push – Chest, Shoulders & Triceps', 'Push – Upper Body + Core', 'Push – Chest Focus'],
  pullA: ['Pull – Back & Biceps', 'Pull – Back + Glutes', 'Pull – Back Width Focus'],
  legsA: ['Legs – Quads, Hamstrings & Glutes', 'Legs – Glute Focus', 'Legs – Quads, Hamstrings & Glutes'],
};
['push', 'pull', 'legs'].forEach(t => { DAY_TITLES[t + 'B'] = DAY_TITLES[t + 'A'].map(s => s.replace(/^(\w+)/, '$1 B')); });

/* Goal-based prescriptions */
const RX = {
  fatloss:  { M: { sets: 3, reps: [10, 12], rest: 60 },  A: { sets: 3, reps: [12, 15], rest: 45 } },
  muscle:   { M: { sets: 4, reps: [6, 10],  rest: 120 }, A: { sets: 3, reps: [10, 12], rest: 75 } },
  recomp:   { M: { sets: 4, reps: [6, 10],  rest: 90 },  A: { sets: 3, reps: [10, 15], rest: 60 } },
  strength: { M: { sets: 5, reps: [3, 6],   rest: 180 }, A: { sets: 3, reps: [6, 10],  rest: 90 } },
};
const COMPOUND = new Set(['squat', 'hinge', 'lunge', 'glute', 'hpush', 'vpush', 'hpull', 'vpull']);
const STRENGTH_LIFTS = new Set(['squat', 'hinge', 'hpush', 'vpush', 'hpull', 'vpull']);
const SMALL = new Set(['core', 'calf', 'abduct', 'latraise', 'reardelt']);
const LOWER_PATTERNS = new Set(['squat', 'hinge', 'lunge', 'glute']);
const PHASES = { 1: 'Foundation', 2: 'Build', 3: 'Peak' };

const resolveEmphasis = p => (!p.emphasis || p.emphasis === 'auto') ? (p.gender === 'female' ? 'lower' : 'upper') : p.emphasis;
const isDeload = week => week % 4 === 0 || !!(S.profile && (S.profile.extraDeloads || []).includes(week));

function phaseInfo(week) {
  const block = Math.ceil(week / 4), bw = (week - 1) % 4 + 1;
  if (isDeload(week)) return { name: week === 12 ? 'Deload & reassess' : bw === 4 ? 'Deload week' : 'Extra deload week (fatigue)', desc: 'Fewer sets, lighter weights. Let your body absorb the last 3 weeks of work – you’ll come back stronger.', deload: true, block };
  const desc = [
    'Learn the movements and find your working weights. Leave ~3 reps in the tank.',
    'Same weights as last week – add 1–2 reps per set.',
    'Top of the rep range. Push hard, keep form perfect.',
  ][bw - 1];
  return { name: `${PHASES[block]} block · week ${bw} of 3`, desc: block > 1 && bw === 1 ? 'New block: add 2.5–5 kg to your lifts and restart at the bottom of the rep range.' : desc, deload: false, block };
}

/* Injury-friendly mode: exercises that load a sore area heavily are skipped.
   If a movement slot has nothing safe left, a gentler pattern is used instead. */
const INJURY_AREAS = { knee: 'Knee', back: 'Lower back', shoulder: 'Shoulder', wrist: 'Wrist / elbow' };
const INJURY_AVOID = {
  knee: ['back-squat', 'front-squat', 'walking-lunge', 'bulgarian-split-squat', 'reverse-lunge', 'leg-extension', 'jump-squat', 'burpee', 'wall-sit', 'nordic-curl'],
  back: ['back-squat', 'front-squat', 'deadlift', 'romanian-deadlift', 'db-rdl', 'barbell-row', 'band-good-morning', 'kb-swing', 'overhead-press', 'burpee', 'hanging-knee-raise'],
  shoulder: ['overhead-press', 'seated-db-press', 'pike-push-up', 'band-overhead-press', 'bench-dip', 'db-fly', 'pull-up', 'db-pullover', 'bench-press', 'skull-crusher', 'burpee'],
  wrist: ['push-up', 'incline-push-up', 'front-squat', 'barbell-curl', 'skull-crusher', 'burpee', 'mountain-climber', 'pike-push-up'],
};
const INJURY_SUBSTITUTE = { squat: 'glute', lunge: 'glute', hinge: 'glute', quadiso: 'hamcurl', vpush: 'reardelt', vpull: 'hpull', hpush: 'fly' };
const avoidSet = p => new Set((p.injuries || []).flatMap(a => INJURY_AVOID[a] || []));

/* Pick an exercise for a slot that matches the user's equipment, level and injuries */
function pickExercise(pattern, offset, p, used, depth = 0) {
  const allow = EQUIPMENT_PROFILES[p.equipment].allow, avoid = avoidSet(p);
  const maxLevel = p.level === 'beginner' ? 2 : 3;
  const ok = e => e.pattern === pattern && allow.includes(e.equip) && !avoid.has(e.id);
  let pool = EXERCISE_DB.filter(e => ok(e) && e.level <= maxLevel);
  if (!pool.length) pool = EXERCISE_DB.filter(ok);
  for (let i = 0; i < pool.length; i++) {
    const cand = pool[(offset + i) % pool.length];
    if (used.has(cand.id)) continue;
    const swapId = p.swaps && p.swaps[cand.id];              // user-chosen replacement
    const swapped = swapId && EX[swapId] && !used.has(swapId) && !avoid.has(swapId) ? EX[swapId] : null;
    return { ex: swapped || cand, orig: cand.id };
  }
  if (!depth && avoid.size && INJURY_SUBSTITUTE[pattern]) return pickExercise(INJURY_SUBSTITUTE[pattern], offset, p, used, 1);
  return null;
}

/* Sets, reps, rest, RPE and tempo – with progressive overload across the 12 weeks */
function prescribe(ex, role, p, week) {
  const base = RX[p.goal][role];
  let sets = base.sets, [lo, hi] = base.reps, rest = base.rest;
  if (ex.timed) { [lo, hi] = p.level === 'beginner' ? [20, 40] : [30, 60]; rest = Math.min(rest, 60); }
  else if (SMALL.has(ex.pattern)) { lo = Math.max(lo, 10); hi = Math.max(hi, 15); rest = Math.min(rest, 75); }
  else if (p.goal === 'strength' && role === 'M' && !STRENGTH_LIFTS.has(ex.pattern)) { [lo, hi] = [6, 10]; rest = 120; }
  if (role === 'M' && p.level === 'beginner') sets = Math.max(3, sets - 1);
  if (role === 'M' && p.session === 90) sets += 1;

  const bw = (week - 1) % 4 + 1, block = Math.ceil(week / 4), deload = isDeload(week);
  let target, rpe, note;
  if (deload) {
    sets = Math.max(2, Math.round(sets * 0.6));
    target = lo; rpe = 6;
    note = 'Deload: use ~85% of last week’s weight and stop 4 reps short of failure.';
  } else {
    target = Math.round(lo + (hi - lo) * [0, 0.5, 1][Math.min(bw, 3) - 1]);   // add reps week to week…
    rpe = [7, 8, 9][Math.min(bw, 3) - 1];
    note = bw === 1
      ? (block === 1 ? 'Find a weight that leaves ~3 reps in the tank.' : 'New block: add weight vs. last block, reps reset to the bottom of the range.') // …then weight
      : bw === 2 ? 'Same weight as last week – add 1–2 reps per set.'
      : 'Top of the range – beat last week by a rep with clean form.';
  }
  if (ex.timed) note = deload ? 'Easy holds – focus on breathing.' : 'Add 5–10 s per hold each week.';
  const tempo = ex.timed ? 'Hold' : role === 'M' ? (p.goal === 'strength' ? '2-1-X-0' : '3-0-1-0') : '3-0-1-1';
  return { sets, lo, hi, target, rest, rpe, tempo, deload, note, timed: !!ex.timed, perSide: !!ex.perSide };
}

function warmupFor(region, p, first) {
  const items = [WARMUP_GENERAL[p.equipment], ...WARMUP_DRILLS[region]];
  if (first && !['bodyweight', 'band'].includes(first.ex.equip)) items.push(`Ramp-up sets of ${first.ex.name}: light ×10, ~50% ×6, ~70% ×3`);
  return items;
}

function finisherFor(p, week, dayNum) {
  const gym = p.equipment === 'gym';
  if (isDeload(week)) return { title: 'Easy cardio', time: '10–15 min', items: ['Zone 2: brisk walk, easy cycling or cross-trainer – you should still be able to chat.'] };
  const hiit = gym
    ? ['3 min easy on the bike, rower or ski-erg', '30 s hard sprint / 60 s easy × 8–10 rounds', '2–3 min easy cool-down']
    : ['Circuit – 40 s work / 20 s rest, 4 rounds (16 min):', 'Jump squats (or fast bodyweight squats)', 'Mountain climbers', 'Burpees (or step-back burpees)', 'High knees (or fast marching)'];
  const liss = gym ? ['Incline treadmill walk: 10–12% incline at 5–5.5 km/h for 20 min'] : ['Brisk walk, stair climbing or skipping, 20 min at a steady pace'];
  switch (p.goal) {
    case 'fatloss': return dayNum % 2 ? { title: 'HIIT finisher', time: '15–20 min', items: hiit } : { title: 'Steady cardio finisher', time: '20 min', items: liss };
    case 'recomp': return dayNum % 2
      ? { title: 'Conditioning', time: '10–15 min', items: gym ? ['Bike or rower: 30 s hard / 90 s easy × 6 rounds'] : ['3 rounds, 30 s work / 30 s rest: jump squats, mountain climbers, burpees'] }
      : { title: 'Incline walk', time: '15 min', items: liss.map(s => s.replace('20 min', '15 min')) };
    case 'muscle': return { title: 'Optional cardio', time: '10 min', items: ['Easy incline walk or bike for heart health – keep it light so it doesn’t eat into recovery.'] };
    default: return { title: 'Loaded carries (optional)', time: '5–10 min', items: [p.equipment === 'home' ? 'Bear crawl 3 × 20 m + plank 3 × 30 s' : 'Farmer’s carry: 3 × 30–40 m, heavy, tall posture'] };
  }
}

/* Day number within the 12-week program, after any "missed workout → do it today" shifts */
function programIndex(dateISO) {
  const p = S.profile;
  const shift = (p.shifts || []).filter(x => x.from <= dateISO).reduce((n, x) => n + x.days, 0);
  return daysBetween(p.startDate, dateISO) - shift;
}
/* Most recent scheduled workout in the last 3 days that wasn't completed */
function missedWorkout() {
  const today = todayISO();
  if (S.logs[today] && Object.keys(S.logs[today].sets || {}).length) return null;
  for (let i = 1; i <= 3; i++) {
    const ds = iso(addDays(parseISO(today), -i)), sch = scheduleFor(ds);
    if (sch.status === 'train') return S.logs[ds] && S.logs[ds].completed ? null : Object.assign({ date: ds }, dayPlan(ds));
  }
  return null;
}

/* Training status for any date – cheap, no exercise selection */
function scheduleFor(dateISO) {
  const p = S.profile;
  if (!p) return { status: 'none' };
  const moved = (p.moved || []).find(m => m.date === dateISO);
  if (moved) return { status: 'moved', to: moved.to };
  const idx = programIndex(dateISO);
  if (idx < 0) return { status: 'before' };
  const week = Math.floor(idx / 7) + 1;
  if (week > 12) return { status: 'after', week };
  const dow = idx % 7, slot = SCHEDULE[p.days].indexOf(dow);
  if (slot < 0) return { status: 'rest', week, dow, deload: isDeload(week) };
  return { status: 'train', week, dow, dayNum: slot + 1, dayKey: SPLITS[p.days][slot], deload: isDeload(week) };
}

/* Full workout for a date (memoised until the profile changes) */
const planCache = new Map();
function dayPlan(dateISO) {
  if (planCache.has(dateISO)) return planCache.get(dateISO);
  const s = scheduleFor(dateISO);
  const out = s.status === 'train' ? Object.assign({}, s, buildDay(s.dayKey, s.week, s.dayNum)) : s;
  planCache.set(dateISO, out);
  return out;
}

function buildDay(dayKey, week, dayNum) {
  const p = S.profile, tpl = TEMPLATES[dayKey], emph = resolveEmphasis(p);
  const slots = tpl.slots.map(([pattern, role, v = 0]) => ({ pattern, role, v }));
  const bonus = ((EMPHASIS_BONUS[tpl.type] || {})[emph] || []).map(pattern => ({ pattern, role: 'A', v: 0 }));
  slots.splice(slots.filter(s => s.role === 'M').length, 0, ...bonus);

  let max = { 45: 5, 60: 6, 90: 8 }[p.session] || 6;
  if (p.goal === 'fatloss' && p.session !== 90) max -= 1;     // leave time for the cardio finisher
  if (p.level === 'beginner') max = Math.min(max, 6);

  const used = new Set(), exercises = [];
  for (const s of slots) {
    if (exercises.length >= max) break;
    const pick = pickExercise(s.pattern, s.v + tpl.variant, p, used);
    if (!pick) continue;
    used.add(pick.ex.id); used.add(pick.orig);
    exercises.push({ ex: pick.ex, orig: pick.orig, role: s.role, rx: prescribe(pick.ex, s.role, p, week) });
  }
  // Time-efficient sessions pair accessories into supersets (A1 → A2, then rest)
  exercises.sort((a, b) => (a.role === 'M' ? 0 : 1) - (b.role === 'M' ? 0 : 1));
  if (p.goal === 'fatloss' || p.session === 45) {
    const acc = exercises.filter(it => it.role === 'A' && !it.rx.timed);
    for (let i = 0, n = 0; i + 1 < acc.length; i += 2, n++) {
      const L = String.fromCharCode(65 + n);
      acc[i].ss = L + '1'; acc[i + 1].ss = L + '2';
      acc[i].rx = Object.assign({}, acc[i].rx, { rest: 15, ssNext: acc[i + 1].ex.name });
      acc[i + 1].rx = Object.assign({}, acc[i + 1].rx, { rest: acc[i + 1].rx.rest + 15 });
    }
  }
  const region = REGION[tpl.type];
  const titleIdx = emph === 'lower' ? 1 : emph === 'upper' ? 2 : 0;
  return {
    title: DAY_TITLES[dayKey][titleIdx], type: tpl.type, region, exercises,
    warmup: warmupFor(region, p, exercises[0]),
    finisher: finisherFor(p, week, dayNum),
    cooldown: COOLDOWNS[region],
  };
}

/* Easier / harder alternatives from the same movement pattern */
function alternatives(ex) {
  const allow = S.profile ? EQUIPMENT_PROFILES[S.profile.equipment].allow : null;
  const same = EXERCISE_DB.filter(e => e.pattern === ex.pattern && e.id !== ex.id);
  const prefer = list => { const ok = allow ? list.filter(e => allow.includes(e.equip)) : list; return ok.length ? ok : list; };
  const easier = prefer(same.filter(e => e.level < ex.level)).sort((a, b) => b.level - a.level)[0] || null;
  const harder = prefer(same.filter(e => e.level > ex.level)).sort((a, b) => a.level - b.level)[0] || null;
  return { easier, harder };
}
const canUse = ex => !S.profile || EQUIPMENT_PROFILES[S.profile.equipment].allow.includes(ex.equip);

/* Most recent logged session of an exercise before a date */
function lastPerformance(exId, beforeISO) {
  const dates = Object.keys(S.logs).filter(d => d < beforeISO).sort().reverse();
  for (const d of dates) {
    const sets = ((S.logs[d] || {}).sets || {})[exId];
    const done = (sets || []).filter(s => s && s.done);
    if (done.length) return { date: d, sets: done };
  }
  return null;
}

/* Progressive-overload suggestion based on last session */
function suggestion(ex, rx, last) {   // eslint-disable-line no-param-reassign
  const noLoad = ex.equip === 'bodyweight' || ex.equip === 'band';
  if (!last) return { summary: '', tip: noLoad ? `First session: aim for ${rx.target}${rx.timed ? ' s' : ' clean reps'} per set.` : `First session: choose a weight that feels like RPE ${rx.rpe} (≈${10 - rx.rpe} reps left in the tank).`, next: null };
  // Coming back from a deload? Judge progress against the last normal session instead
  let back = '';
  if (!rx.deload) {
    for (let i = 0; i < 3 && last && S.logs[last.date] && S.logs[last.date].week && isDeload(S.logs[last.date].week); i++) {
      const prev = lastPerformance(ex.id, last.date);
      if (!prev) break;
      last = prev; back = 'Back from the deload – ';
    }
  }
  const ws = last.sets.map(s => num(s.w)).filter(n => n > 0);
  const reps = last.sets.map(s => num(s.r)).filter(n => n > 0);
  const rpes = last.sets.map(s => num(s.rpe)).filter(n => n > 0);
  const avgRpe = rpes.length ? rpes.reduce((a, b) => a + b, 0) / rpes.length : null;
  const w = ws.length ? Math.max(...ws) : 0;
  const summary = `${back ? 'Last normal week' : 'Last time'} (${fmtShort(last.date)}): ${w ? w + ' kg × ' : ''}${reps.join(', ') || '—'}${rx.timed ? ' s' : ''}${avgRpe ? ` · RPE ${+avgRpe.toFixed(1)}` : ''}`;
  if (rx.deload) return { summary, tip: w ? `Deload: use about ${roundTo(w * 0.85, 2.5)} kg.` : 'Deload: easy effort, perfect form.', next: w ? roundTo(w * 0.85, 2.5) : null };
  const hitTop = reps.length > 0 && reps.every(r => r >= rx.hi);
  const missed = reps.some(r => r < rx.lo);
  const grind = avgRpe !== null && avgRpe >= 9.5;
  const easy = avgRpe !== null && avgRpe <= 7 && reps.length > 0 && reps.every(r => r >= rx.target);
  if (noLoad || !w) return { summary, tip: hitTop || easy ? 'That was comfortable – try the harder variation or add a 2 s pause.' : grind ? 'Last time was a grind – repeat it with cleaner reps.' : 'Beat last time by 1–2 reps per set.', next: null };
  const inc = LOWER_PATTERNS.has(ex.pattern) ? 5 : COMPOUND.has(ex.pattern) ? 2.5 : 1;
  // Auto-adjust: stalls and grinders come down, easy or top-of-range sets go up
  if (isStalled(ex.id, last.date)) return { summary, tip: `No progress for 3 sessions – reset to ${roundTo(w * 0.9, 2.5)} kg and build back up.`, next: roundTo(w * 0.9, 2.5), flag: 'stall' };
  if (missed || grind) return { summary, tip: `Last time was a grind${avgRpe ? ` (RPE ${+avgRpe.toFixed(1)})` : ''} – drop to ${roundTo(w * 0.95, 1.25)} kg and own every rep.`, next: roundTo(w * 0.95, 1.25), flag: 'down' };
  if (hitTop && (avgRpe === null || avgRpe <= 9)) return { summary, tip: `Top of the range hit – increase to ${w + inc} kg.`, next: w + inc, flag: 'up' };
  if (easy) return { summary, tip: `Felt easy (RPE ${+avgRpe.toFixed(1)}) – go up to ${w + inc} kg.`, next: w + inc, flag: 'up' };
  return { summary, tip: `Stay at ${w} kg and add a rep or two.`, next: w };
}

/* Best estimated 1RM of an exercise per session, oldest first */
function sessionBests(exId, uptoISO) {
  return Object.keys(S.logs).filter(d => d <= uptoISO).sort().map(d => {
    const sets = (((S.logs[d] || {}).sets || {})[exId] || []).filter(x => x && x.done && num(x.w) > 0 && num(x.r) > 0);
    return sets.length ? { date: d, v: Math.max(...sets.map(x => e1rm(num(x.w), num(x.r)))) } : null;
  }).filter(Boolean);
}
/* Stalled = the last 3 sessions show no e1RM gain over the session before them */
function isStalled(exId, uptoISO) {
  const b = sessionBests(exId, uptoISO);
  if (b.length < 4) return false;
  const base = b[b.length - 4].v;
  return b.slice(-3).every(x => x.v <= base * 1.005);
}
/* Recovery check over the last 14 days: high average effort or several stalled lifts */
function fatigueCheck() {
  const since = iso(addDays(new Date(), -14)), today = todayISO(), rpes = [], ids = new Set();
  Object.keys(S.logs).filter(d => d >= since && d <= today).forEach(d => Object.entries(S.logs[d].sets || {}).forEach(([id, arr]) => {
    (arr || []).forEach(x => { if (x && x.done && num(x.rpe)) rpes.push(num(x.rpe)); });
    ids.add(id);
  }));
  const avg = rpes.length ? rpes.reduce((a, b) => a + b, 0) / rpes.length : 0;
  const stalled = [...ids].filter(id => isStalled(id, today)).map(id => EX[id] ? EX[id].name : id);
  return { avg, stalled, high: (rpes.length >= 8 && avg >= 9) || stalled.length >= 2 };
}
/* Personal records: every session where an exercise's best e1RM beat all earlier sessions */
function personalRecords() {
  const best = {}, out = [];
  Object.keys(S.logs).sort().forEach(d => Object.entries((S.logs[d] || {}).sets || {}).forEach(([id, arr]) => {
    const ex = EX[id];
    if (!ex || ex.timed) return;
    (arr || []).forEach(x => {
      if (!x || !x.done || !(num(x.w) > 0) || !(num(x.r) > 0)) return;
      const v = e1rm(num(x.w), num(x.r));
      if (best[id] && v > best[id] + 0.01) out.push({ date: d, id, name: ex.name, w: num(x.w), r: num(x.r), v, prev: best[id] });
      if (!best[id] || v > best[id]) best[id] = v;
    });
  }));
  return out.reverse();
}

function rxText(rx) { return `${rx.sets} × ${rx.target}${rx.timed ? ' s' : ''}${rx.perSide ? '/side' : ''}`; }

/* Streak, totals and this-week completion */
function workoutStats() {
  const today = todayISO();
  let streak = 0, d = parseISO(today);
  for (let i = 0; i < 500; i++) {
    const ds = iso(d), s = scheduleFor(ds);
    if (s.status === 'before') break;
    if (s.status === 'train') {
      if (S.logs[ds] && S.logs[ds].completed) streak++;
      else if (ds !== today) break;               // today isn't missed yet
    }
    d = addDays(d, -1);
  }
  const total = Object.values(S.logs).filter(l => l && l.completed).length;
  const mon = mondayOf(new Date());
  let planned = 0, done = 0;
  for (let i = 0; i < 7; i++) {
    const ds = iso(addDays(mon, i));
    if (scheduleFor(ds).status === 'train') { planned++; if (S.logs[ds] && S.logs[ds].completed) done++; }
  }
  return { streak, total, planned, done };
}

function currentWeek() {
  if (!S.profile) return 1;
  const idx = programIndex(todayISO());
  return clamp(Math.floor(idx / 7) + 1, 1, 12);
}

/* Best estimated 1RM per key lift and per session */
function strengthData() {
  const series = {};
  Object.keys(KEY_LIFTS).forEach(k => { series[k] = {}; });
  Object.keys(S.logs).sort().forEach(date => {
    const sets = (S.logs[date] || {}).sets || {};
    Object.entries(sets).forEach(([exId, arr]) => {
      const ex = EX[exId];
      if (!ex || !ex.key) return;
      (arr || []).forEach(s => {
        const w = num(s && s.w), r = num(s && s.r);
        if (!s || !s.done || !w || !r || r > 15) return;
        const v = e1rm(w, r);
        const cur = series[ex.key][date];
        if (!cur || v > cur.v) series[ex.key][date] = { v, w, r, name: ex.name };
      });
    });
  });
  return series;
}

/* Mifflin-St Jeor + goal adjustment, with safe calorie floors */
const ACTIVITY = [
  [1.2, 'Sedentary (desk job, little walking)'],
  [1.375, 'Light (training 3×/week)'],
  [1.465, 'Moderate (training 4×/week)'],
  [1.55, 'Active (training 5–6×/week)'],
  [1.725, 'Very active (training + physical job)'],
];
const defaultActivity = days => ({ 3: 1.375, 4: 1.465, 5: 1.55, 6: 1.55 }[days] || 1.465);
function nutrition(p) {
  const male = p.gender === 'male';
  const bmr = 10 * p.weight + 6.25 * p.height - 5 * p.age + (male ? 5 : -161);
  const act = p.activity || defaultActivity(p.days);
  const tdee = bmr * act;
  const floor = male ? 1500 : 1200;
  let lo, hi, label;
  switch (p.goal) {
    case 'fatloss': lo = tdee * 0.80; hi = tdee * 0.85; label = '15–20% deficit'; break;
    case 'muscle': lo = hi = tdee * 1.10; label = '+10% surplus'; break;
    case 'strength': lo = tdee; hi = tdee * 1.05; label = 'Maintenance to +5%'; break;
    default: lo = hi = tdee; label = 'Maintenance';
  }
  const floored = lo < floor;
  lo = Math.max(lo, floor); hi = Math.max(hi, floor);
  const target = roundTo((lo + hi) / 2, 10);
  const pPerKg = { fatloss: 2.0, recomp: 2.0, muscle: 1.8, strength: 1.8 }[p.goal];
  const protein = Math.round(p.weight * pPerKg);
  const fat = Math.round(target * 0.25 / 9);
  const carbs = Math.max(0, Math.round((target - protein * 4 - fat * 9) / 4));
  const bmi = p.weight / Math.pow(p.height / 100, 2);
  return {
    bmr: Math.round(bmr), tdee: roundTo(tdee, 10), lo: roundTo(lo, 10), hi: roundTo(hi, 10), target, label, floored, floor,
    protein, proteinRange: [Math.round(p.weight * 1.6), Math.round(p.weight * 2.2)], fat, carbs,
    water: (p.weight * 0.035).toFixed(1), bmi: bmi.toFixed(1), act,
  };
}

/* ---------------------------------------------------------------------
   5. REST TIMER – timestamp based so it stays accurate in background tabs
   --------------------------------------------------------------------- */
const Sound = {
  ctx: null,
  unlock() {
    try {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) {}
  },
  beep() {
    try {
      const c = this.ctx; if (!c) return;
      [0, 0.32, 0.64].forEach((t, i) => {
        const o = c.createOscillator(), g = c.createGain(), at = c.currentTime + t;
        o.type = 'square'; o.frequency.value = i === 2 ? 1320 : 880;
        g.gain.setValueAtTime(0.0001, at);
        g.gain.exponentialRampToValueAtTime(0.22, at + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, at + 0.24);
        o.connect(g); g.connect(c.destination); o.start(at); o.stop(at + 0.28);
      });
    } catch (e) {}
  },
};

/* Voice coach: spoken rest calls (Web Speech API, works offline on most phones) */
const Voice = {
  say(text) {
    try {
      if (!S.settings.voice || !('speechSynthesis' in window)) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = S.settings.lang === 'hi' ? 'hi-IN' : 'en-IN';
      u.rate = 1.02;
      speechSynthesis.speak(u);
    } catch (e) {}
  },
};
/* "Rest over" notification when the app is in the background (best effort: phones
   may delay timers while the screen is locked) */
function notifyRestOver(text) {
  try {
    if (!S.settings.notify || !document.hidden || !('Notification' in window) || Notification.permission !== 'granted') return;
    const opts = { body: text, tag: 'tf-rest', renotify: true, vibrate: [300, 120, 300], icon: 'icons/icon-192.png', badge: 'icons/icon-192.png' };
    if (navigator.serviceWorker && navigator.serviceWorker.controller) navigator.serviceWorker.ready.then(r => r.showNotification('MuscularMen', opts));
    else new Notification('MuscularMen', opts);
  } catch (e) {}
}

const Timer = {
  end: 0, total: 0, left: 0, paused: false, iv: null, lock: null, hideT: null, label: 'Rest', spoke10: false, nextText: '',
  get el() { return $('#timer'); },
  start(sec, label, nextText) {
    this.total = sec; this.end = Date.now() + sec * 1000; this.paused = false; this.label = label || 'Rest';
    this.spoke10 = sec <= 15; this.nextText = nextText || '';
    $('#timerLabel').textContent = this.label;
    $('#timerToggle').textContent = t('timer.pause');
    Voice.say(nextText && sec <= 15 ? nextText : t('v.rest', { n: sec }));
    this.el.hidden = false;
    this.el.classList.remove('finished');
    document.body.classList.add('timer-on');
    clearTimeout(this.hideT);
    clearInterval(this.iv);
    this.iv = setInterval(() => this.tick(), 200);
    this.tick();
    Sound.unlock();
    this.keepAwake();
  },
  remaining() { return this.paused ? this.left : Math.max(0, this.end - Date.now()); },
  tick() {
    const ms = this.remaining(), s = Math.ceil(ms / 1000);
    $('#timerTime').textContent = `${Math.floor(s / 60)}:${pad(s % 60)}`;
    $('#timerBar').style.width = (this.total ? clamp(ms / (this.total * 1000), 0, 1) * 100 : 0) + '%';
    if (!this.paused && !this.spoke10 && s === 10) { this.spoke10 = true; Voice.say(t('v.ten')); }
    if (!this.paused && ms <= 0) this.finish();
  },
  finish() {
    clearInterval(this.iv); this.iv = null;
    this.el.classList.add('finished');
    $('#timerLabel').textContent = this.nextText || t('timer.over');
    $('#timerTime').textContent = t('timer.go');
    if (S.settings.sound) Sound.beep();
    Voice.say(this.nextText || t('v.go'));
    notifyRestOver(this.nextText || t('timer.over'));
    try { if (navigator.vibrate) navigator.vibrate([300, 120, 300, 120, 500]); } catch (e) {}
    this.release();
    this.hideT = setTimeout(() => { if (this.el.classList.contains('finished')) this.stop(); }, 7000);
  },
  adjust(delta) {
    if (this.el.classList.contains('finished')) { if (delta > 0) this.start(delta, this.label); return; }
    if (this.paused) this.left = Math.max(0, this.left + delta * 1000);
    else this.end = Math.max(Date.now(), this.end + delta * 1000);
    this.total = Math.max(this.total, Math.ceil(this.remaining() / 1000));
    this.tick();
  },
  toggle() {
    if (!this.iv) return;
    if (this.paused) { this.paused = false; this.end = Date.now() + this.left; $('#timerToggle').textContent = t('timer.pause'); }
    else { this.left = this.remaining(); this.paused = true; $('#timerToggle').textContent = t('timer.resume'); }
    this.tick();
  },
  stop() {
    clearInterval(this.iv); this.iv = null; this.paused = false;
    clearTimeout(this.hideT);
    this.el.hidden = true;
    this.el.classList.remove('finished', 'big');
    document.body.classList.remove('timer-on');
    this.release();
  },
  async keepAwake() {   // keep the phone screen on while resting
    try {
      if ('wakeLock' in navigator && !this.lock) {
        this.lock = await navigator.wakeLock.request('screen');
        this.lock.addEventListener('release', () => { this.lock = null; });
      }
    } catch (e) {}
  },
  release() { try { if (this.lock) this.lock.release(); } catch (e) {} this.lock = null; },
};
