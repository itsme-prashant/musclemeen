# Netlify settings for MuscularMen (a static site – nothing to build)
[build]
  publish = "."
  command = ""

# Keep the optional Node server and the media tooling off the public site
[[redirects]]
  from = "/server/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/index.html"
  status = 404
  force = true

# The AI coach and cloud sync need the Node server; on Netlify the app shows setup instructions
[[redirects]]
  from = "/api/*"
  to = "/index.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"

# The service worker must always be fresh so updates reach installed apps
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Exercise videos and illustrations rarely change – let phones cache them for a week
[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
